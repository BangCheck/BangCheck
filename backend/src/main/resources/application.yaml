spring:
  datasource:
    url: jdbc:mysql://localhost:3307/room?serverTimezone=Asia/Seoul
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: ${app.paths.flyway-locations}
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret-key: your-256bit-secret-key-here-must-be-long-enough
  access-token-expiration: 3600000
  refresh-token-expiration: 86400000

oauth:
  naver:
    client-id: ${NAVER_CLIENT_ID:dkEdhIEi2Sh86ooVCQAu}
    client-secret: ${NAVER_CLIENT_SECRET:4vncC5iJAP}
    redirect-uri: ${app.paths.oauth.naver-redirect-uri}
    authorize-uri: https://nid.naver.com/oauth2.0/authorize
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me
  google:
    client-id: ${GOOGLE_CLIENT_ID:407812313351-imjj8k3flkajrqcmotc81n7gnbfbnosi.apps.googleusercontent.com}
    client-secret: ${GOOGLE_CLIENT_SECRET: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}
    redirect-uri: ${app.paths.oauth.google-redirect-uri}
    authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
    scope: openid email profile

springdoc:
  swagger-ui:
    path: ${app.paths.swagger-ui-path}
  api-docs:
    path: ${app.paths.api-docs-path}

app:
  paths:
    auth-base-path: /api/v1/auth
    auth-oauth-base-path: /oauth2
    auth-refresh-path: /jwt/refresh
    auth-logout-path: /logout
    swagger-ui-path: /swagger-ui.html
    api-docs-path: /v3/api-docs
    flyway-locations: classpath:db/migration
    oauth:
      naver-redirect-uri: ${OAUTH_NAVER_REDIRECT_URI:http://localhost:3000/auth/callback/naver}
      google-redirect-uri: ${OAUTH_GOOGLE_REDIRECT_URI:http://localhost:3000/auth/callback/google}
    cors-allowed-origins:
      - ${FRONTEND_ORIGIN_3000:http://localhost:3000}
      - ${FRONTEND_ORIGIN_5173:http://localhost:5173}
