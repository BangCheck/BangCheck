spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

oauth:
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI}
    authorize-uri: https://nid.naver.com/oauth2.0/authorize
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me  
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
    scope: openid email profile

naver:
  geocoding:
    client-id: ${NAVER_GEOCODING_CLIENT_ID}
    client-secret: ${NAVER_GEOCODING_CLIENT_SECRET}
    url: https://naveropenapi.apigw.ntruss.com/map-geocode/v2/geocode

tmap:
  api:
    app-key: ${TMAP_APP_KEY}

juso:
  api:
    confirm-key: ${JUSO_CONFIRM_KEY}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  paths:
    auth-base-path: /api/v1/auth
    auth-oauth-base-path: /oauth2
    auth-refresh-path: /jwt/refresh
    auth-logout-path: /logout
    swagger-ui-path: /swagger-ui.html
    api-docs-path: /v3/api-docs
    flyway-locations: classpath:db/migration
    cors-allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - https://bangcheck-woo-jonghos-projects.vercel.app
      - https://bangcheck.site
      - https://api.bangcheck.site
      - https://www.bangcheck.site
