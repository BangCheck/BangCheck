# AI-PROTECTED-FILE v1.0
# DO NOT MODIFY: Admin-only. Contact @Woo-JongHo for changes.
#
# ============================================================
# SWYP Compliance Specification
# ============================================================
#
# Purpose:
#   Declaration of the compliance rules this repository enforces.
#
# WARNING — this file does not enforce anything by itself.
#   The actual judgement lives in inline regexes inside
#   .github/workflows/compliance-guard.yml. This file only declares them.
#   The two drifted before (2026-08-04): this file said the rules lived here
#   while the workflow held its own copy, so editing this file changed nothing.
#   Change both together, or the declaration becomes a lie.
#
#   Also read by:
#     - PM audit workflow (_wood/agents/pm/workflows/05-audit.md)
#     - Human reference (_wood/workflows/_CODING-GUIDE.md)
#
# Update policy:
#   - Admin-only (via PR with CODEOWNERS review)
#   - Changes affect all PRs from the moment they merge
#
# ============================================================

policy:
  version: "2.0"
  last_reviewed: "2026-08-04"
  admin_login: "Woo-JongHo"

# ============================================================
# Severity Levels
# ============================================================
# error:   check fails → merge blocked (UI warning)
# warning: check passes but comment posted
# info:    silent pass (logged only)
# ============================================================

severity_levels:
  error:
    label: "compliance-violation"
    label_color: "B60205"
    block_merge: true
  warning:
    label: "compliance-warning"
    label_color: "FBCA04"
    block_merge: false
  info:
    block_merge: false

# ============================================================
# Rules
# ============================================================

rules:

  # ─────────────────────────────────────────────
  # Atlas scope — 이 PR이 어느 화면을 건드리는가
  # ─────────────────────────────────────────────

  atlas_scope:
    severity: warning
    enabled: true
    pattern: '(^|\n)\s*Atlas:\s*\S+'
    location: "pr_body"
    description: |
      PR 본문에 `Atlas:` 줄이 있어야 한다. 값은 Atlas 상세 캔버스의
      pageId 또는 route를 그대로 쓴다.
      화면과 무관한 변경이면 `Atlas: 없음`이라고 적는다 —
      빈 칸과 "해당 없음"은 구별되어야 한다.
    examples_good:
      - "Atlas: landing"
      - "Atlas: /custom"
      - "Atlas: 없음"
    fix_guide: |
      PR description에 한 줄 추가:
      Atlas: {pageId 또는 route}

  # ─────────────────────────────────────────────
  # Forbidden paths — 되돌릴 수 없는 사고를 막는다
  # ─────────────────────────────────────────────

  forbidden_files:
    severity: error
    enabled: true
    patterns:
      - "\\.env$"
      - "\\.env\\.local$"
      - "\\.env\\.production$"
      - "\\.pem$"
      - "\\.key$"
      - "\\.p12$"
      - "\\.pfx$"
      - "credentials\\.json$"
      - "secrets\\.(json|yaml|yml)$"
    description: "Sensitive files must not be committed"
    fix_guide: |
      git rm --cached {file}
      echo "{pattern}" >> .gitignore
      git commit --amend

  # ─────────────────────────────────────────────
  # Protected files (coordinate with protected-files.yml)
  # ─────────────────────────────────────────────

  protected_files_mention:
    severity: info
    enabled: true
    description: "When protected files are modified, .github/workflows/protected-files.yml handles it separately"
    delegate_to: ".github/workflows/protected-files.yml"

# ============================================================
# 걷어낸 규칙 (2026-08-04)
# ============================================================
#
# 아래는 형식을 강제하던 규칙들이다. 판단은 리뷰가 하고,
# 자동 검사는 되돌릴 수 없는 것만 막는다는 방침으로 제거했다.
#
#   branch_naming      브랜치명에 이슈번호 강제
#   issue_linkage      모든 PR에 closes #N 요구
#   commit_type        커밋 메시지 conventional 접두 요구
#   commit_issue_ref   커밋 본문에 #N 요구
#   pr_template        What/Why/Test 섹션 요구
#   issue_labels       연결 이슈의 라벨 3종 요구
#   pr_size            변경 800줄 상한
#
# 되살릴 조건: 이 규칙들이 없어서 실제로 사고가 났을 때.
# 그 전까지는 없는 게 기본값이다.

removed_rules:
  removed_at: "2026-08-04"
  removed_by: "Woo-JongHo"
  reason: "형식 강제가 과했다. 자동 검사는 되돌릴 수 없는 것만 막는다"
  names:
    - branch_naming
    - issue_linkage
    - commit_type
    - commit_issue_ref
    - pr_template
    - issue_labels
    - pr_size

# ============================================================
# Exemptions
# ============================================================

exemptions:
  # Admin can be exempt from certain rules (emergency only)
  admin_override:
    enabled: false   # Disabled by default (Admin follows the same rules)
    allowed_roles: [Admin]

  # PRs with specific labels skip checks
  skip_labels:
    - "skip-compliance"   # Only when Admin explicitly applies it

# ============================================================
# Reporting
# ============================================================

reporting:
  pr_comment:
    enabled: true
    template_file: ".github/templates/compliance-comment.md"
    update_on_fix: true       # Auto-update comment when fixed

  label_application:
    enabled: true

  audit_trail:
    enabled: true
    retain_days: 90

# ============================================================
# Human guide
# ============================================================

references:
  coding_guide: "_wood/workflows/_CODING-GUIDE.md"
  pr_workflow: "_wood/workflows/05-pr.md"
  commit_workflow: "_wood/workflows/04-commit.md"
  audit_workflow: "_wood/agents/pm/workflows/05-audit.md"
