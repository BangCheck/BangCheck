# AI-PROTECTED-FILE v1.0
# DO NOT MODIFY: Admin-only. Contact @Woo-JongHo for changes.
#
# ============================================================
# SWYP Compliance Specification
# ============================================================
#
# Purpose:
#   Centralized definition of SWYP compliance rules.
#   Used by:
#     - GitHub Actions (.github/workflows/compliance-guard.yml)
#     - PM audit workflow (_wood/agents/pm/workflows/05-audit.md)
#     - Human reference (_wood/workflows/_CODING-GUIDE.md)
#
# Update policy:
#   - Admin-only (via PR with CODEOWNERS review)
#   - Changes affect all PRs from the moment they merge
#
# ============================================================

policy:
  version: "1.0"
  last_reviewed: "2026-04-16"
  admin_login: "Woo-JongHo"

# ============================================================
# Severity Levels
# ============================================================
# error:   check fails → merge blocked (UI warning)
# warning: check passes but comment posted
# info:    silent pass (logged only)
# ============================================================

severity_levels:
  error:
    label: "compliance-violation"
    label_color: "B60205"
    block_merge: true
  warning:
    label: "compliance-warning"
    label_color: "FBCA04"
    block_merge: false
  info:
    block_merge: false

# ============================================================
# Rules
# ============================================================

rules:

  # ─────────────────────────────────────────────
  # Branch naming
  # ─────────────────────────────────────────────

  branch_naming:
    severity: error
    enabled: true
    # revert 추가 — 머지 이력에 revert/be-directions-rollback 이 실재한다(2026-08-05 실측).
    # 실제로 쓰이는 타입을 목록에서 빼두면 정상 작업이 error로 죽는다.
    pattern: '^(feat|fix|refactor|docs|chore|design|revert)/[0-9]+-[a-z0-9-]+$'
    description: "Branch name must follow {type}/{issue-number}-{slug} format"
    examples_good:
      - feat/5-login-form
      - fix/12-naver-auth-error
      - refactor/18-api-retry
    examples_bad:
      - fix-login
      - feature/login
      - my-branch
    fix_guide: |
      git branch -m {correct-name}
      git push --force-with-lease origin {correct-name}
      # Delete the old incorrectly named branch
      git push origin --delete {old-name}

  # ─────────────────────────────────────────────
  # Issue linkage
  # ─────────────────────────────────────────────

  issue_linkage:
    severity: error
    enabled: true
    pattern: '(closes|fixes|resolves)\s+#[0-9]+'
    description: "PR body must include `closes #N` / `fixes #N` / `resolves #N`"
    fix_guide: |
      Edit PR → add `closes #{issue-number}` to the body

  # ─────────────────────────────────────────────
  # Commit message convention
  # ─────────────────────────────────────────────

  commit_type:
    severity: warning
    enabled: true
    pattern: '^(feat|fix|docs|refactor|chore|design|comment|remove):\s+.+'
    description: "Each commit message first line must follow `{type}: {summary}` format"
    types_allowed:
      - feat
      - fix
      - docs
      - refactor
      - chore
      - design
      - comment
      - remove
    fix_guide: |
      git commit --amend  # Fix the last commit (before push)
      # If already pushed:
      git rebase -i {commit_hash}  # Edit the message
      git push --force-with-lease

  commit_issue_ref:
    # 실행기에 구현은 있으나 관측 기준선이 없어 꺼 둔다.
    # spec이 enabled인데 실행기에 없던 규칙이라, spec을 실행기의 정본으로 연결하는
    # 순간 아무 예고 없이 켜질 뻔했다. 켜려면 먼저 현행 커밋들이 이 규칙을 얼마나
    # 어기는지 측정해야 한다.
    severity: warning
    enabled: false
    pattern: '#[0-9]+'
    description: "Commit body must include an issue number (`#N` format)"
    location: "body"

  # ─────────────────────────────────────────────
  # PR body template
  # ─────────────────────────────────────────────

  pr_template:
    severity: warning
    enabled: true
    # 2026-08-05 실측: 머지된 PR 5건의 본문이 100% 아래 형식이고 swyp-pr 명령도 이것을 만든다.
    # 이전 값은 What/Why/Test 였는데 그 형식을 쓴 PR은 한 건도 없었다 — 모든 PR에서
    # 100% 오탐이 떴고, 경고가 상시로 뜨면 사람은 경고를 안 읽게 된다.
    # 정본을 관행 쪽으로 잡고 .github/PULL_REQUEST_TEMPLATE.md 를 여기 맞췄다.
    required_sections:
      - "^##\\s+Summary"
      - "^##\\s+Linked Issue"
      - "^##\\s+Changes"
    description: "PR body must contain Summary/Linked Issue/Changes sections"
    fix_guide: |
      Edit PR description → follow .github/PULL_REQUEST_TEMPLATE.md

  # ─────────────────────────────────────────────
  # Linked issue labels
  # ─────────────────────────────────────────────

  issue_labels:
    severity: warning
    # 2026-08-05 비활성화. 완화가 아니라 중단이다.
    # 이 저장소에 `순위:` 접두 라벨과 `상태:` 라벨이 존재하지 않아 통과가 구조적으로
    # 불가능했다(최근 이슈 15건 중 13건이 라벨 0개). 실재하는 라벨만 검사하도록
    # 완화하면 ISSUE_TEMPLATE으로 라벨을 강제할 때 규칙을 또 고쳐야 한다.
    # 라벨 체계가 확정되는 시점에 정확한 요구로 한 번만 되켠다.
    enabled: false
    required_label_prefixes:
      - "유형:"
      - "순위:"
      - "상태:"
    description: "Linked issues must have all type/priority/status labels assigned"
    fix_guide: |
      Add labels on the issue page:
      gh issue edit {n} --add-label "유형:작업,순위:높음,상태:진행중"

  # ─────────────────────────────────────────────
  # PR size
  # ─────────────────────────────────────────────

  pr_size:
    severity: warning
    enabled: true
    thresholds:
      caution: 400
      exceed: 800
    description: "PR changed lines should be ≤400 recommended, warning if >800"
    exceptions:
      # Exclude auto-generated files like filename renames
      - pattern: "package-lock.json"
      - pattern: "*.generated.*"
    fix_guide: |
      Split the PR into smaller units and submit each as a separate PR
      Reference: _wood/workflows/_CODING-GUIDE.md § PR Convention

  # ─────────────────────────────────────────────
  # Forbidden paths
  # ─────────────────────────────────────────────

  forbidden_files:
    severity: error
    enabled: true
    patterns:
      - "\\.env$"
      - "\\.env\\.local$"
      - "\\.env\\.production$"
      - "\\.pem$"
      - "\\.key$"
      - "\\.p12$"
      - "\\.pfx$"
      - "credentials\\.json$"
      - "secrets\\.(json|yaml|yml)$"
    description: "Sensitive files must not be committed"
    fix_guide: |
      git rm --cached {file}
      echo "{pattern}" >> .gitignore
      git commit --amend

  # ─────────────────────────────────────────────
  # Protected files (coordinate with protected-files.yml)
  # ─────────────────────────────────────────────

  protected_files_mention:
    # 판정은 protected-files.yml 이 단독으로 소유한다. 여기서 켜도 findings를 만들지
    # 않으므로 선언만 남아 두 곳이 같은 것을 본다는 오해를 만든다.
    severity: info
    enabled: false
    description: "When protected files are modified, .github/workflows/protected-files.yml handles it separately"
    delegate_to: ".github/workflows/protected-files.yml"

# ============================================================
# Exemptions
# ============================================================

exemptions:
  # Admin can be exempt from certain rules (emergency only)
  admin_override:
    enabled: false   # Disabled by default (Admin follows the same rules)
    allowed_roles: [Admin]

  # skip_labels 는 2026-08-05에 제거했다.
  #
  # 라벨 기반 우회는 특정 head SHA에 묶이지 않는다. Admin이 한 번 붙인 라벨은
  # 그 뒤에 올라온 커밋까지 계속 통과시킨다. timeline API로 라벨을 단 actor를
  # 확인할 수 있지만 그 한계는 해소되지 않으므로, 권한 검사를 붙여도 안전한
  # 우회가 되지 못한다.
  #
  # 긴급 상황의 탈출구는 PR 라벨이 아니라 required check 승격 시 GitHub의
  # 감사 가능한 Admin bypass로 둔다. 그 전까지는 오탐을 P0로 고친다.

# ============================================================
# Reporting
# ============================================================

reporting:
  pr_comment:
    enabled: true
    template_file: ".github/templates/compliance-comment.md"
    update_on_fix: true       # Auto-update comment when fixed

  label_application:
    enabled: true

  audit_trail:
    enabled: true
    retain_days: 90

# ============================================================
# Human guide
# ============================================================

references:
  coding_guide: "_wood/workflows/_CODING-GUIDE.md"
  pr_workflow: "_wood/workflows/05-pr.md"
  commit_workflow: "_wood/workflows/04-commit.md"
  audit_workflow: "_wood/agents/pm/workflows/05-audit.md"
