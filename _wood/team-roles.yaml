# ============================================================
# Protected Files (doc_owner=true required to edit)
# ============================================================

ownership:
  protected_files:
    # AI governance (root conventions)
    - "AGENTS.md"
    - "CLAUDE.md"
    - ".cursorrules"
    - ".claude/commands/**"
    - ".claude/agents/**"
    - ".github/CODEOWNERS"
    - ".github/copilot-instructions.md"
    - ".github/workflows/protected-files.yml"

    # AI infrastructure (_wood/)
    - "_wood/workflows/**"
    - "_wood/agents/**"
    - "_wood/team-roles.yaml"        # this file
    - "_wood/milestone-meta.yaml"

    # Team conventions (Admin only)
    - "docs/team-conventions.md"

# ============================================================
# PM-editable (Admin + PM, no code)
# ============================================================
# PM can edit these paths but MUST create a PR for Admin review.
# Direct push to main is NOT allowed for PM.
# 2026-08-10: 이 파일은 유효한 YAML 이 아니었다.
#   `pm_editable_paths` 는 시퀀스인데 그 안에 `pr_policy:` 매핑 키가 섞여 있어
#   파서가 line 167 에서 죽었다. 아무도 몰랐던 이유는 아무도 파싱하지 않았기
#   때문이다 — 훅은 sed 로, 워크플로는 이 값을 안 읽었다.
#   #221 에서 승인 명단을 이 파일의 `members` 에서 읽기 시작하면서 드러났다.
#   선언만 있고 읽는 쪽이 없으면 틀려도 티가 안 난다.
pm_editable_paths:
  - "docs/spec/**"                    # Product spec (xlsx, md)
  - "_wood/templates/**"              # Issue templates
  - "_wood/workspace/_shared/**"      # Shared sprint-status, story template

# PM edits require PR → Admin review → merge
pm_edit_policy: "pr-required"

# ============================================================
# Role → Menu Mapping
# ============================================================
#
# Menus:
#   P = Project management (issues, milestones)
#   T = Todo (daily work — pick → code → commit → PR)
#   C = Commit (standalone)
#   R = PR (standalone)
#   S = Status / Refresh
#
# primary:   Recommended menus (shown with ⭐)
# secondary: Available but not recommended
# hidden:    Not shown (hard-blocked)
# ============================================================

role_menus:
  Admin:
    greeting: "👑 Admin {name}, welcome back!"
    primary: [P, T, C, R]
    secondary: [S]
    hidden: []
    can_edit_protected: true
    can_change_roles: true

  PM:
    greeting: "📌 PM {name}, welcome back!"
    primary: [P, S, R]
    secondary: [T, C]
    hidden: []
    can_edit_protected: false    # Cannot edit AI infra md files (AGENTS, _wood/, .claude/, .github/)
    can_edit_spec: true           # Can edit docs/spec/**
    can_change_roles: false
    notes: "Near-Admin privileges. Only restricted from editing AI policy md files."

  Frontend:
    greeting: "🔧 Frontend {name}, welcome back!"
    primary: [T, C, R]
    secondary: [P]
    hidden: []
    can_edit_protected: false
    can_change_roles: false

  Design:
    greeting: "🎨 Design {name}, welcome back!"
    primary: [P]
    secondary: [S]
    hidden: [T, C, R]
    can_edit_protected: false
    can_change_roles: false

  Backend:
    greeting: "⚙️ Backend {name}, welcome back!"
    primary: [S]
    secondary: [P]
    hidden: [T, C, R]
    can_edit_protected: false
    can_change_roles: false

  Guest:
    greeting: "👋 Hello {name}. You are not yet registered."
    primary: []
    secondary: []
    hidden: [P, T, C, R, S]
    can_edit_protected: false
    can_change_roles: false
    extra_message: "Contact @Woo-JongHo to be added to team-roles."

# ============================================================
# AI Refusal Templates
# ============================================================
# Used when AI must refuse a request based on role policy.
# These messages MUST be returned verbatim by AI assistants.
# ============================================================

refusal_templates:
  role_change_attempt: |
    ❌ Only Admin can change roles.

    Current role: {current_role}
    Requested role: {requested_role}

    Please contact Admin(@Woo-JongHo).

  protected_file_edit: |
    ❌ This file is protected (Admin-only).

    File: {path}
    Current role: {current_role}
    Required role: Admin

    Please request changes from Admin(@Woo-JongHo).

  hidden_menu_access: |
    ❌ This feature is not available for your current role ({current_role}).

    Required role: {required_role}
    Please request access from Admin(@Woo-JongHo) if needed.

  unregistered_user: |
    👋 Hello!
    You are not yet registered on the team roster.

    Please request registration from Admin(@Woo-JongHo) with the following info:
    - GitHub login: {user_login}
    - Name: (your name)
    - Desired role: PM / Frontend / Design / Backend
