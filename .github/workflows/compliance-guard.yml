# ============================================================
# SWYP Compliance Guard
# ------------------------------------------------------------
# Purpose:
#   Detect PRs that bypass SWYP conventions.
#
# 규칙의 정본은 _wood/workflows/_compliance-spec.yaml 이다.
#   이 워크플로는 그것을 실제로 읽는다. 예전에는 yq를 설치만 하고 규칙을 여기
#   하드코딩해서, spec이 "Used by: GitHub Actions"라고 선언하면서도 아무도 읽지
#   않는 상태로 3개월 굳어 있었다. 선언과 실행이 갈리면 선언이 썩는다.
#
# 판정 로직은 .github/scripts/compliance-rules.mjs 가 소유한다.
#   워크플로 안의 인라인 스크립트는 테스트할 수 없어서 "301번째 파일은 검사하지
#   않는다", "31번째 커밋은 안 본다" 같은 결함이 오래 남았다.
#   이제 .github/scripts/compliance-rules.test.mjs 가 그것을 붙들고 있다.
#
# 이 워크플로가 하는 일은 셋뿐이다 — 데이터 수집(페이지네이션 포함), 판정 위임, 보고.
#
# 우회 라벨(skip-compliance)은 2026-08-05에 제거했다.
#   라벨 기반 우회는 특정 head SHA에 묶이지 않아, Admin이 한 번 붙이면 그 뒤에
#   올라온 커밋까지 계속 통과시킨다. 긴급 탈출구는 required check 승격 시
#   GitHub의 감사 가능한 Admin bypass로 둔다.
#
# Companion workflows:
#   protected-files.yml  (Admin-only file protection)
#   atlas-resolve.yml    (registry ↔ 코드 정합)
# ============================================================

name: Compliance Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  compliance:
    name: Verify SWYP conventions
    runs-on: ubuntu-latest

    steps:
      # ────────────────────────────────────────────
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ────────────────────────────────────────────
      # 규칙이 살아 있는지 먼저 본다. 통과하는 것과 규칙이 실제로 잡는 것은 다르다.
      # 이것이 실패하면 아래 판정은 믿을 수 없으므로 순서가 중요하다.
      - name: Verify rules still catch violations
        run: node --test .github/scripts/compliance-rules.test.mjs

      # ────────────────────────────────────────────
      # spec은 YAML이고 판정기는 JS다. 변환만 파이썬이 한다.
      - name: Load compliance spec
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 -c "import json,sys,yaml; json.dump(yaml.safe_load(open('_wood/workflows/_compliance-spec.yaml')), open('/tmp/spec.json','w'), ensure_ascii=False)"
          echo "spec 규칙:"
          python3 -c "import json;[print(f'  {k:24} {v.get(\"severity\"):8} enabled={v.get(\"enabled\")}') for k,v in json.load(open('/tmp/spec.json'))['rules'].items()]"

      # ────────────────────────────────────────────
      - name: Run compliance checks
        id: checks
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const spec = JSON.parse(fs.readFileSync('/tmp/spec.json', 'utf8'));
            const { evaluate, summarize } =
              await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/compliance-rules.mjs`);

            const prNumber = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            });

            // paginate — 예전에는 files가 첫 300개, commits가 첫 30개만 왔다.
            // 그 뒤의 금지파일과 커밋은 아무도 보지 않았다.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: prNumber, per_page: 100,
            });
            const rawCommits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: prNumber, per_page: 100,
            });

            // closes #N 으로 연결된 이슈
            let issue = null;
            const linkage = (pr.body || '').match(/(closes|fixes|resolves)\s+#(\d+)/i);
            if (linkage) {
              try {
                const { data } = await github.rest.issues.get({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: parseInt(linkage[2], 10),
                });
                issue = {
                  number: data.number,
                  labels: data.labels.map(l => (typeof l === 'string' ? l : l.name)),
                };
              } catch (error) {
                core.warning(`연결된 이슈 #${linkage[2]} 조회 실패: ${error.message}`);
              }
            }

            const { findings } = evaluate({
              branch: pr.head.ref,
              body: pr.body || '',
              commits: rawCommits.map(c => ({ sha: c.sha, message: c.commit.message })),
              files: files.map(f => ({
                filename: f.filename, additions: f.additions, deletions: f.deletions,
              })),
              issue,
            }, spec);

            const { errors, warnings } = summarize(findings);
            core.setOutput('errors_count', errors.length);
            core.setOutput('warnings_count', warnings.length);
            fs.writeFileSync('/tmp/errors.json', JSON.stringify(errors, null, 2));
            fs.writeFileSync('/tmp/warnings.json', JSON.stringify(warnings, null, 2));
            core.info(`검사 대상: 파일 ${files.length}개 · 커밋 ${rawCommits.length}개`);
            core.info(`Errors: ${errors.length}, Warnings: ${warnings.length}`);

      # ────────────────────────────────────────────
      - name: Post/update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const errors = JSON.parse(fs.readFileSync('/tmp/errors.json', 'utf8'));
            const warnings = JSON.parse(fs.readFileSync('/tmp/warnings.json', 'utf8'));

            let body = `## 🔍 Compliance Check Report\n\n`;
            if (errors.length + warnings.length === 0) {
              body += `✅ **모든 컨벤션 준수 — 통과**\n\n이 PR은 SWYP 컨벤션을 따르고 있습니다.\n`;
            } else {
              body += `이 PR은 SWYP 컨벤션 일부를 따르지 않습니다.\n\n`;
              const render = (title, items) => {
                body += `### ${title} (${items.length}건)\n\n`;
                items.forEach((item, index) => {
                  body += `**${index + 1}. ${item.rule}**\n  ${item.message}\n`;
                  if (item.expected) body += `  기대: \`${item.expected}\`\n`;
                  if (item.examples) body += `  예시: ${item.examples.map(x => `\`${x}\``).join(', ')}\n`;
                  if (item.details) body += `\n\`\`\`\n${item.details}\n\`\`\`\n`;
                  if (item.fix) body += `  수정: \`${item.fix}\`\n\n`;
                });
              };
              if (errors.length) render('❌ Errors (수정 필수)', errors);
              if (warnings.length) render('⚠️ Warnings (권장)', warnings);
            }
            body += `\n---\n`;
            body += `규칙 정본: [_compliance-spec.yaml](../blob/main/_wood/workflows/_compliance-spec.yaml) · `;
            body += `판정 로직: [compliance-rules.mjs](../blob/main/.github/scripts/compliance-rules.mjs)\n`;
            body += `이 코멘트는 compliance-guard Action이 자동 생성했습니다.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('🔍 Compliance Check Report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      # ────────────────────────────────────────────
      - name: Apply labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const errors = JSON.parse(fs.readFileSync('/tmp/errors.json', 'utf8'));
            const warnings = JSON.parse(fs.readFileSync('/tmp/warnings.json', 'utf8'));

            const ensureLabel = async (name, color, desc) => {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner, repo: context.repo.repo, name,
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name, color, description: desc,
                }).catch(() => {});
              }
            };
            const applyLabel = async (name) => {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.issue.number, labels: [name],
                });
              } catch {}
            };
            const removeLabel = async (name) => {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.issue.number, name,
                });
              } catch {}
            };

            await ensureLabel('compliance-violation', 'B60205', 'Compliance errors detected');
            await ensureLabel('compliance-warning', 'FBCA04', 'Compliance warnings detected');
            if (errors.length > 0) await applyLabel('compliance-violation');
            else await removeLabel('compliance-violation');
            if (warnings.length > 0) await applyLabel('compliance-warning');
            else await removeLabel('compliance-warning');

      # ────────────────────────────────────────────
      - name: Fail if errors exist
        if: steps.checks.outputs.errors_count != '0'
        run: |
          echo "❌ ${{ steps.checks.outputs.errors_count }}건의 컨벤션 위반이 있습니다."
          echo "PR 코멘트 확인 후 수정해 주세요."
          exit 1
