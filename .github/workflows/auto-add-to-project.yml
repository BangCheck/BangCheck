name: Auto-add issues to project

on:
  issues:
    types: [opened]

permissions:
  issues: read
  repository-projects: write

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.4
        with:
          project-url: https://github.com/orgs/SWYP-Backend/projects/2
          github-token: ${{ secrets.GITHUB_TOKEN }}

