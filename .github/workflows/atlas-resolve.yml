# ============================================================
# Atlas Resolver Gate
# ------------------------------------------------------------
# Purpose:
#   registry(.project-atlas/registry/)에 적힌 값이 실제 저장소와
#   맞는지 검사한다. 어긋난 채로 머지되면 Project Atlas 화면이
#   조용히 틀린 사실을 보여준다 — 화면은 틀렸다고 말하지 않으므로
#   "확인 안 함"과 구별되지 않는 상태가 된다.
#
#   검사 항목은 .project-atlas/tools/resolve.py가 소유한다
#   (ID-01/02, REF-01, SRC-01/02, RTE-01, WRT-01, FEC-01,
#    FLD-01, ENM-01, ISS-01).
#
# 왜 frontend build 체인이 아니라 여기인가:
#   resolve.py는 PyYAML을 요구한다. frontend build는 node만 있으면
#   돌고 deploy-frontend.yml도 node만 설치한다. build 체인에 python
#   의존을 끼우면 배포 경로가 깨진다.
#   같은 판단이 frontend/scripts/check-atlas-snapshot.mjs 주석에
#   이미 기록돼 있다 — "화면 하나를 최신으로 만들려고 배포 경로
#   전체를 인질로 잡는 셈이다".
#   그래서 강제는 PR 게이트에서 걸고, 배포 경로의 의존 표면은
#   node로 유지한다.
#
# Companion workflows:
#   compliance-guard.yml   (PR 컨벤션)
#   protected-files.yml    (Admin 보호 파일)
# ============================================================

name: Atlas Resolve

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read

jobs:
  resolve:
    name: Verify registry resolves against the repository
    runs-on: ubuntu-latest

    steps:
      # base 의 defects.yaml 이 필요하다 — 이 PR 이 조인 키를 어디까지 건드렸는지
      # 그것과 대조해야 안다. fetch-depth: 0 이 아니면 base SHA 가 없어
      # `git show` 가 실패한다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ────────────────────────────────────────────
      # AD-12에 따라 .project-atlas/는 별도 저장소로 분리될 예정이다.
      # 나간 뒤에는 이 저장소에 검증할 원천이 없다. 원천이 없는 것을
      # 위반으로 부르면 그때부터 PR이 못 나간다.
      # check-atlas-snapshot.mjs와 같은 판단이다.
      - name: Check registry presence
        id: presence
        run: |
          if [ -d .project-atlas/registry ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "atlas-resolve 건너뜀 — .project-atlas/registry가 없다 (AD-12 분리 후 정상)"
          fi

      # ────────────────────────────────────────────
      - name: Setup Python
        if: steps.presence.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ────────────────────────────────────────────
      # 의존성 선언은 .project-atlas/requirements.txt가 소유한다.
      # 여기에 패키지명을 다시 적으면 분리하는 날 갈라진다.
      - name: Install resolver dependencies
        if: steps.presence.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check -r .project-atlas/requirements.txt

      # ────────────────────────────────────────────
      # 규칙이 살아 있는지 먼저 본다. resolver가 통과하는 것과 resolver의
      # 규칙이 실제로 잡는 것은 다르다 — 규칙이 죽어도 통과는 초록불이다.
      # 순서가 중요하다. 이것이 먼저 실패하면 아래 통과는 의미가 없다.
      - name: Verify resolver rules still catch violations
        if: steps.presence.outputs.present == 'true'
        run: python .project-atlas/tools/test_resolve.py

      # ────────────────────────────────────────────
      - name: Run Atlas resolver
        if: steps.presence.outputs.present == 'true'
        run: python .project-atlas/tools/resolve.py

      # ────────────────────────────────────────────
      # sync 규칙도 살아 있는지 먼저 본다. resolver 와 같은 이유다.
      # 2026-08-07 까지 이 도구에는 테스트가 아예 없었고, 그동안 마커 파서의
      # 오탐이 하루에 두 번 CI 를 깼는데 잡는 자리가 없었다 (#262).
      - name: Verify sync rules still catch violations
        if: steps.presence.outputs.present == 'true'
        run: python .project-atlas/tools/test_sync_check.py

      # ────────────────────────────────────────────
      # registry ↔ GitHub Issue 대조 — **이 PR 이 건드린 결함만.**
      #
      # resolve.py 는 네트워크를 모른다 — 그것이 그 도구의 성질이라 ISS-01 은
      # issue 값이 양의 정수인지만 본다. 999999 를 적어도 통과한다.
      # 번호가 실재하는지, 그 번호가 정말 그 결함인지는 여기서 본다.
      #
      # 왜 전역이 아니라 --scope pr 인가 (#262)
      #   이 검사의 역방향(SYN-03)은 저장소의 **모든 이슈**를 훑는다. PR 과
      #   인과가 없는 전역 상태다. 이슈를 먼저 열고 registry 항목을 나중에
      #   넣는 것은 정상 작업 흐름인데(봇 안내문 자신이 그렇게 안내한다),
      #   그 사이 창이 열릴 때마다 무관한 PR 이 전부 떨어졌다.
      #   2026-08-07 하루에 세 번 났고, 워크플로 파일 하나를 지운 PR #258 이
      #   두 번 그 채무를 갚았다 — 그 작성자는 고칠 권한도 맥락도 없었다.
      #
      # 전역 검사는 사라지지 않는다. atlas-sync-audit.yml 이 소유한다.
      #   낮춘 것이 아니라 **옮긴 것**이다. 그쪽은 이슈가 열리거나 편집되는
      #   즉시 돌기 때문에, PR 을 인질로 잡지 않고도 같은 드리프트가 더 빨리
      #   드러난다. 여기서 경고로 낮췄다면 "맞다"와 "안 봤다"가 같은 초록불이
      #   됐을 것이고, 이 job 이 gh 실패조차 죽이는 이유와 정면으로 어긋난다.
      #
      # gh 실패는 exit 2 로 나오며 "검사 불가"이지 "어긋남"이 아니다.
      # 그래도 job 은 실패시킨다 — 검사하지 못한 것을 통과로 적으면
      # 초록불이 "맞다"와 "안 봤다"를 구별하지 못하게 된다.
      - name: Verify registry and issues agree (this PR's scope)
        if: steps.presence.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # base 에 이 파일이 없을 수 있다 — registry 가 그 시점 이후에
          # 들어온 경우다. 그때는 빈 목록을 base 로 둔다. 그러면 HEAD 의
          # 모든 결함이 "이 PR 이 추가한 것"이 되어 전부 검사된다.
          if git cat-file -e "$BASE_SHA:.project-atlas/registry/defects.yaml" 2>/dev/null; then
            git show "$BASE_SHA:.project-atlas/registry/defects.yaml" > /tmp/base-defects.yaml
          else
            echo "defects: []" > /tmp/base-defects.yaml
            echo "base 에 defects.yaml 이 없다 — HEAD 전체를 이 PR 의 범위로 본다"
          fi
          python .project-atlas/tools/sync_check.py --scope pr --base /tmp/base-defects.yaml

      # ────────────────────────────────────────────
      # registry ↔ atlas-snapshot.json 정합. (#237)
      #
      # 왜 PR 에서 봐야 하는가
      #   이 검사는 지금까지 `npm run build` 앞에만 있었다. 그런데 build 를 부르는
      #   것은 deploy-frontend 뿐이고, 그 워크플로에는 `paths: frontend/**` 필터가
      #   있다. registry 만 고친 PR 은 그 필터에 안 걸려 **배포가 아예 안 돈다.**
      #   그래서 낡은 스냅샷이 실패로 나타나지 않고 침묵한다.
      #
      #   2026-08-06 실측: #238(defects.yaml 6줄)이 PR 게이트 셋을 전부 통과하고
      #   머지됐다. 그 커밋(f48af17)을 떼어 검사하면 exit 1 이다. 배포는 안 돌아
      #   아무 신호도 없었고, 5분 뒤 사람이 기억해서 #253 으로 닫았다.
      #   다음에 프론트를 건드리는 사람의 PR 에서 터졌다면 그 사람은 자기가 만들지
      #   않은 실패를 봤을 것이다.
      #
      # 왜 재생성이 아니라 검사인가
      #   재생성은 python + PyYAML 을 요구한다. 이 job 은 이미 그것을 깔지만,
      #   봇이 커밋을 밀어 넣으면 PR 작성자가 만들지 않은 변경이 자기 PR 에 생긴다.
      #   무엇을 실행해야 하는지 말하고 멈추는 쪽이 정직하다.
      #   같은 판단이 check-atlas-snapshot.mjs 주석에 적혀 있다.
      #
      # node 만 있으면 된다 — 스크립트가 의존성 없이 sha256 만 대조한다.
      - name: Verify snapshot matches registry
        if: steps.presence.outputs.present == 'true'
        run: node frontend/scripts/check-atlas-snapshot.mjs

# runtime → 승인 baseline 방향(atlasBaselineCompare)은 여기 없다.
# 이 workflow에 baseline job으로 배선해 PR #216에서 실제로 돌려봤고,
# 인프라(MySQL Testcontainers·Spring 부팅)와 routes.txt·flyway 대조는 통과했으나
# bean-names 다이제스트의 승인본이 저장소에 없어 실패했다. 그것은 이 게이트의
# 결함이 아니라 backend 쪽에서 결정할 사안이라 분리했다 — 이슈 #217.
