# ============================================================
# Atlas Sync Audit — registry ↔ Issue 전역 정합
# ------------------------------------------------------------
# 무엇을 소유하는가
#   registry 와 GitHub Issue 가 저장소 전체에서 맞는지 본다.
#   atlas-resolve.yml 의 PR 게이트는 **그 PR 이 건드린 결함**만 보므로,
#   전역 어긋남의 소유자는 여기다. 둘을 합치면 남의 드리프트로 무관한 PR 이
#   막히고, 둘 다 없으면 아무도 안 본다.
#
# 왜 PR 게이트에서 옮겨왔는가 (#262)
#   SYN-03(고아 투영)은 저장소의 **모든 이슈**를 훑는 전역 상태라 PR 과 인과가
#   없다. 그런데 PR 게이트에 있으면 그 상태가 어긋난 동안 전부 떨어진다.
#
#   2026-08-07 실측 — 하루에 세 번 났다.
#     00:30경  #255·#256 이 registry 백필 전 → PR #258(워크플로 파일 1개 삭제)이 떨어짐
#     00:52    #259 가 열림(마커 정상, registry 항목 아직 없음) → #258 이 또 떨어짐
#     02:15    #262 가 봇 안내문을 인용하며 마커 문법을 코드 스팬에 적음
#              → 파서가 진짜 마커로 읽어 고아로 판정 → PR #261 이 떨어짐
#
#   셋 다 PR 작성자가 만들지 않았고, 고칠 권한도 맥락도 없었다.
#   "이슈를 먼저 열고 registry 를 나중에 채운다"는 정상 흐름이고 원자적일 수
#   없다 — 그 사이 창은 구조적으로 존재한다.
#
# 왜 낮추지 않고 옮겼는가
#   기존 위반을 경고로 바꾸는 안을 먼저 세웠다가 기각했다. 이 저장소는
#   gh 실패조차 job 을 죽인다 — "맞다"와 "안 봤다"를 같은 초록불로 만들지
#   않기 위해서다. 실재하는 어긋남을 경고로 내리면 그 계약이 깨진다.
#   그래서 강도는 그대로 두고 **자리만** 옮겼다.
#
# 왜 issues 이벤트가 핵심인가
#   push:main 과 schedule 만 두면 "머지된 뒤에야 안다"가 된다.
#   issues 에 걸면 이슈가 열리거나 편집되는 **그 순간** 잡히므로,
#   위 사고 셋이 전부 PR 이 열리기도 전에 드러난다.
#   PR 을 인질로 잡던 것보다 오히려 빠르다.
#
# Companion workflows:
#   atlas-resolve.yml    (PR 게이트 — registry ↔ 코드, 그리고 그 PR 범위의 sync)
#   atlas-triage.yml     (이슈 열림 시 파트·담당자 제안)
# ============================================================

name: Atlas Sync Audit

on:
  issues:
    types: [opened, edited, reopened, closed, deleted]
  push:
    branches: [main]
    paths:
      - '.project-atlas/registry/**'
      - '.project-atlas/tools/**'
      - '.github/workflows/atlas-sync-audit.yml'
  schedule:
    # 이슈도 registry 도 안 바뀌어도 하루 한 번은 본다.
    # 이벤트 기반만 두면 놓친 이벤트가 영원히 안 잡힌다 — 러너 미할당으로
    # 죽은 실행이 실제로 있었다(#246).
    - cron: '0 0 * * *'
  workflow_dispatch:

# 이슈 이벤트는 몰려 온다(투영 도구가 한 번에 여러 건을 만든다).
# 마지막 상태만 보면 되므로 진행 중인 것을 취소한다 — PR 게이트와 달리
# 여기서는 중간 상태의 판정이 남을 이유가 없다.
concurrency:
  group: atlas-sync-audit
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  audit:
    name: Verify registry and issues agree (repository-wide)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ────────────────────────────────────────────
      # AD-12 에 따라 .project-atlas/ 는 별도 저장소로 분리될 예정이다.
      # 나간 뒤에는 이 저장소에 검증할 원천이 없다.
      # atlas-resolve.yml 과 같은 판단이다.
      - name: Check registry presence
        id: presence
        run: |
          if [ -d .project-atlas/registry ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "sync audit 건너뜀 — .project-atlas/registry가 없다 (AD-12 분리 후 정상)"
          fi

      # ────────────────────────────────────────────
      - name: Setup Python
        if: steps.presence.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 의존성 선언은 .project-atlas/requirements.txt 가 소유한다.
      - name: Install dependencies
        if: steps.presence.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check -r .project-atlas/requirements.txt

      # ────────────────────────────────────────────
      # 규칙이 살아 있는지 먼저 본다. 통과하는 것과 규칙이 실제로 잡는 것은
      # 다르다 — 규칙이 죽어도 통과는 초록불이다.
      - name: Verify sync rules still catch violations
        if: steps.presence.outputs.present == 'true'
        run: python .project-atlas/tools/test_sync_check.py

      # ────────────────────────────────────────────
      # 전역 검사. 어긋남이 하나라도 있으면 죽는다.
      # gh 실패(exit 2)도 죽인다 — "검사 불가"를 통과로 적지 않는다.
      - name: Run global sync check
        if: steps.presence.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .project-atlas/tools/sync_check.py
