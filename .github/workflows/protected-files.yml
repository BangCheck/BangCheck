# ============================================================
# Protected Files Guard
# ------------------------------------------------------------
# Purpose:
#   보호 파일을 고친 PR 은 **작성자가 아닌 등록 팀원**의 APPROVED 리뷰가
#   현재 head 커밋에 붙어 있어야 통과한다.
#
# Why this exists:
#   This repo is private and cannot use GitHub Branch Protection
#   without Pro/Team plan. This Action provides equivalent
#   enforcement via PR check status.
#
# 왜 "Admin 승인"이 아니라 "작성자 아닌 팀원 승인"인가 (#221)
#   옛 판본은 Admin(@Woo-JongHo) 의 APPROVED 를 요구했다. 그런데 **GitHub 은
#   자기가 연 PR 을 자기가 승인하는 것을 막는다** — 권한 문제가 아니라 리뷰가
#   "다른 사람이 봤다"를 기록하는 것이기 때문이다.
#   보호 파일은 대부분 Admin 소유물이라, 그것을 고칠 수 있는 유일한 사람이
#   그것을 통과시킬 수 없었다. 통과 경로가 애초에 없었다.
#
#   실측 (2026-08-10): PR #219 는 이 검사가 FAILURE 인 채로, 리뷰 0 건으로
#   머지됐다(2026-08-05T08:47:58Z). 브랜치 보호가 없어 머지 버튼이 눌렸다.
#   즉 이 가드는 한 번도 실제로 통과된 적이 없다 — 걸리면 무시하고 머지했고,
#   안 걸리면(보호 파일 미변경) 초록불이었다.
#
#   그래서 수정 권한은 Admin 에 그대로 두고(훅과 CODEOWNERS 가 맡는다)
#   **리뷰만 등록 팀원 전체에 연다.** 막는 것은 "자기 것을 자기가 승인"이다.
#
# Behavior:
#   1. Detect if any protected file is modified
#   2. If yes → require APPROVED review from a registered member != author,
#      on the exact current head SHA
#   3. If approved → green. If not → red.
#
# Maintenance:
#   - Protected paths are listed in env.PROTECTED_PATTERNS (mirror AGENTS.md)
#   - 승인 가능 명단은 _wood/team-roles.yaml 의 members 가 소유한다.
#     여기에 로그인을 박지 않는다 — 팀이 바뀔 때마다 워크플로를 고쳐야 하고,
#     그 워크플로 자체가 보호 파일이라 고치려면 다시 이 게이트를 지나야 한다.
# ============================================================

name: Protected Files Approval

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

env:
  # ADMIN_LOGIN 은 없앴다. 승인자는 team-roles.yaml 의 members 가 소유하고,
  # 여기에 로그인을 박아두면 그 값이 실제로 쓰이지 않으면서 "Admin 이 승인한다"는
  # 인상만 남는다 — 이 저장소가 #218·#220 에서 두 번 겪은 실패의 모양이다.
  #
  # Glob patterns of protected files (must mirror AGENTS.md + team-roles.yaml)
  # AGENTS.md의 "Protected Files — DO NOT MODIFY" 목록과 같은 항목·같은 순서.
  # 2026-08-05 실측에서 5개가 빠져 있었다 — GEMINI.md, .claude/hooks/**,
  # .claude/settings.json, _wood/context/**, docs/spec/**.
  # 선언(AGENTS.md)과 집행(여기)이 갈리면 보호받는다고 적힌 파일이 실제로는 안 막힌다.
  # compliance-guard.yml 은 CODEOWNERS에만 있고 양쪽 목록에 없어 함께 추가했다.
  PROTECTED_PATTERNS: |
    AGENTS.md
    CLAUDE.md
    GEMINI.md
    .cursorrules
    .claude/commands/**
    .claude/hooks/**
    .claude/settings.json
    .github/CODEOWNERS
    .github/copilot-instructions.md
    .github/workflows/protected-files.yml
    .github/workflows/compliance-guard.yml
    _wood/workflows/**
    _wood/agents/**
    _wood/team-roles.yaml
    _wood/milestone-meta.yaml
    _wood/context/**
    docs/team-conventions.md
    docs/spec/**

jobs:
  guard:
    name: Verify peer approval for protected file changes
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout — PR 의 head 를 **명시적으로** 받는다
      # ------------------------------------------------------------
      # ref 를 안 주면 `github.sha` 를 받는데, 그 값은 이벤트마다 다르다.
      # `pull_request` 에서는 머지 커밋이지만 `pull_request_review` 에서는
      # PR 과 무관한 기본 브랜치 끝이다. 그러면 아래 diff 가 비고
      # "보호 파일 없음 → 통과"로 흘러, **리뷰를 하나 다는 것만으로 검사가
      # 초록불이 되는** 경로가 생긴다. 두 트리거가 같은 것을 보게 못 박는다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # ------------------------------------------------------------
      # 2. Detect changed files in this PR
      # ------------------------------------------------------------
      # base 를 ref 이름이 아니라 SHA 로 잡는다. head 를 detached 로 받아
      # `origin/<base.ref>` 가 이벤트 시점과 어긋날 수 있다.
      - name: Get PR diff
        id: diff
        run: |
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...HEAD" \
            > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      # ------------------------------------------------------------
      # 3. Check if any protected file is modified
      # ------------------------------------------------------------
      - name: Match against protected patterns
        id: match
        run: |
          MATCHED=""
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            # Use git ls-files to expand glob and intersect with diff
            while IFS= read -r changed; do
              [ -z "$changed" ] && continue
              # shellcheck disable=SC2053
              case "$changed" in
                $pattern) MATCHED="${MATCHED}${changed}\n" ;;
              esac
            done < changed_files.txt
          done <<< "${{ env.PROTECTED_PATTERNS }}"

          if [ -n "$MATCHED" ]; then
            echo "has_protected=true" >> "$GITHUB_OUTPUT"
            echo "matched_files<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "$MATCHED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "has_protected=false" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------
      # 4. Skip if no protected files changed
      # ------------------------------------------------------------
      - name: No protected files — pass
        if: steps.match.outputs.has_protected != 'true'
        run: |
          echo "✅ No protected files modified. Approval gate skipped."

      # ------------------------------------------------------------
      # 4-1. 승인 가능 명단 — **base 쪽 team-roles.yaml 에서** 읽는다
      # ------------------------------------------------------------
      # head 에서 읽으면 PR 이 자기 자신을 명단에 넣어 통과할 수 있다.
      # team-roles.yaml 은 보호 파일이지만, 그 보호를 집행하는 것이 바로 이
      # 검사라서 head 를 믿으면 순환이 된다. base 는 이미 머지된 상태이므로
      # 누군가 한 번은 이 게이트를 지난 값이다.
      # setup-python 을 쓰는 것은 atlas 워크플로와 같은 이유다 — 러너 기본
      # 인터프리터에 pip install 하면 Ubuntu 24.04 의 externally-managed
      # 환경 정책에 걸릴 수 있다. 여기는 게이트라 "될 때도 있는" 경로를 두면 안 된다.
      - name: Setup Python
        if: steps.match.outputs.has_protected == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load reviewer roster from base
        id: roster
        if: steps.match.outputs.has_protected == 'true'
        run: |
          set -euo pipefail
          git show "${{ github.event.pull_request.base.sha }}:_wood/team-roles.yaml" \
            > base-team-roles.yaml
          python -m pip install --disable-pip-version-check --quiet pyyaml
          # 명단을 못 읽으면 여기서 죽는다. `set -e` 로 스텝이 실패하고 job 이
          # 실패한다 — fail closed 다. "확인 못 했다"를 초록불로 적지 않는다.
          LOGINS=$(python3 - <<'PY'
          import sys, yaml
          # 파싱 실패와 members 부재를 **다른 문장으로** 말한다.
          # 2026-08-10 실측: base 의 team-roles.yaml 이 유효한 YAML 이 아니어서
          # 이 스텝이 raw traceback 으로 죽었다. 게이트가 왜 막았는지 로그를
          # 끝까지 읽어야 알 수 있으면, 막힌 사람은 게이트를 무시하게 된다.
          try:
              with open("base-team-roles.yaml", encoding="utf-8") as fh:
                  data = yaml.safe_load(fh) or {}
          except yaml.YAMLError as exc:
              sys.exit(
                  "base 브랜치의 _wood/team-roles.yaml 을 파싱하지 못했습니다.\n"
                  f"  {str(exc).splitlines()[0]}\n"
                  "승인 명단은 base 에서 읽습니다 — head 에서 읽으면 PR 이 자기를\n"
                  "명단에 넣어 통과할 수 있기 때문입니다. 그래서 base 가 고쳐지기\n"
                  "전에는 어떤 보호 파일 PR 도 통과할 수 없습니다(fail closed).\n"
                  "먼저 base 의 team-roles.yaml 을 유효한 YAML 로 만드십시오."
              )
          members = data.get("members") or {}
          if not isinstance(members, dict) or not members:
              sys.exit("base 의 _wood/team-roles.yaml 에 members 가 없습니다.")
          print(",".join(sorted(members)))
          PY
          )
          echo "logins=$LOGINS" >> "$GITHUB_OUTPUT"
          echo "roster: $LOGINS"

      # ------------------------------------------------------------
      # 5. Comment on PR (only first time per push)
      # ------------------------------------------------------------
      - name: Comment on PR
        if: steps.match.outputs.has_protected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const matched = `${{ steps.match.outputs.matched_files }}`.trim();
            const body = [
              '🔒 **Protected Files Detected**',
              '',
              'This PR modifies files that require Admin approval:',
              '',
              '```',
              matched,
              '```',
              '',
              '**필요한 것:** 이 PR 의 작성자가 아닌 **등록 팀원 한 명**의',
              '`APPROVED` 리뷰 (현재 head 커밋 기준).',
              '',
              `등록 팀원: ${'`' + `${{ steps.roster.outputs.logins }}`.split(',').join('`, `') + '`'}`,
              '',
              '수정 권한 자체는 Admin 에 있다(AGENTS.md · CODEOWNERS · PreToolUse 훅).',
              '여기서 요구하는 것은 **다른 사람이 봤다**는 기록이다 — 그래서',
              '작성자 본인은 승인자가 될 수 없다 (#221).',
              '',
              'See [AGENTS.md](../blob/main/AGENTS.md) for the full policy.'
            ].join('\n');

            // Only post once — search existing comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const exists = comments.some(c => c.body.includes('Protected Files Detected'));
            if (!exists) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # ------------------------------------------------------------
      # 6. Verify Admin approval
      # ------------------------------------------------------------
      - name: Require peer approval
        if: steps.match.outputs.has_protected == 'true'
        uses: actions/github-script@v7
        env:
          ROSTER: ${{ steps.roster.outputs.logins }}
        with:
          script: |
            const roster = new Set(
              (process.env.ROSTER || '').split(',').map(s => s.trim()).filter(Boolean)
            );
            if (roster.size === 0) {
              // 명단을 못 읽었다. 통과시키지 않는다 — "확인 못 했다"를 초록불로
              // 적으면 게이트가 "맞다"와 "안 봤다"를 구별하지 못하게 된다.
              core.setFailed('승인 가능 명단을 읽지 못했습니다 (_wood/team-roles.yaml).');
              return;
            }

            // 현재 head. 승인은 "이 PR"이 아니라 "이 커밋"에 대해서만 유효하다.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const headSha = pr.head.sha;
            const author = pr.user.login;

            // paginate — 리뷰가 30건을 넘으면 예전에는 뒤쪽을 못 봤다.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            // 사람마다 마지막 리뷰만 본다. APPROVED 뒤에 CHANGES_REQUESTED 가
            // 오면 뒤엣것이 그 사람의 현재 의견이다.
            const latestByUser = new Map();
            for (const r of reviews) latestByUser.set(r.user.login, r);

            // 승인자 조건 셋을 **함께** 본다.
            //   1. 등록 팀원인가        모르는 계정의 승인은 승인이 아니다
            //   2. 작성자가 아닌가      "다른 사람이 봤다"가 이 검사의 전부다
            //   3. 현재 head 를 봤는가  승인 뒤에 밀어넣은 커밋은 아무도 못 봤다
            const approvers = [];
            const stale = [];
            for (const [login, r] of latestByUser) {
              if (!roster.has(login) || login === author) continue;
              if (r.state !== 'APPROVED') continue;
              if (r.commit_id === headSha) approvers.push(login);
              else stale.push(`${login}@${String(r.commit_id).substring(0, 7)}`);
            }

            if (approvers.length > 0) {
              core.info(`✅ Approved by @${approvers.join(', @')} on ${headSha.substring(0, 7)}.`);
              return;
            }

            const eligible = [...roster].filter(l => l !== author);
            const detail = stale.length
              ? `STALE — ${stale.join(', ')} 의 승인은 현재 head ${headSha.substring(0, 7)} 이전 것입니다.`
              : '아직 승인이 없습니다.';

            core.setFailed(
              `🔒 보호 파일을 고친 PR 입니다. 작성자(@${author}) 가 아닌 등록 팀원 한 명의\n` +
              `APPROVED 리뷰가 현재 head(${headSha.substring(0, 7)}) 에 필요합니다.\n` +
              `\n` +
              `현재 상태: ${detail}\n` +
              `승인 가능: ${eligible.map(l => '@' + l).join(', ') || '(없음 — 등록 팀원이 작성자뿐입니다)'}\n` +
              `\n` +
              `수정 권한은 Admin 에 있고, 여기서 요구하는 것은 다른 사람이 봤다는 기록입니다 (#221).`
            );

      # ------------------------------------------------------------
      # 7. 라벨은 붙이지 않는다 (2026-08-10)
      # ------------------------------------------------------------
      # 옛 판본은 `protected-files-modified` 를 붙였다. 그런데 같은 사실을
      # 검사 이름·검사 상태·위 코멘트가 이미 말한다. 라벨은 네 번째 사본이고,
      # 넷 중 유일하게 **왜 막혔는지를 말하지 못하는** 사본이었다.
      # compliance-guard.yml 의 라벨도 같은 이유로 함께 걷었다.
