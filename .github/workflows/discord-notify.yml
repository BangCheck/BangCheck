# Discord로 커스텀 알림을 보낸다.
#
# 왜 이 파일이 있는가:
#   Discord GitHub 통합(/github endpoint)은 embed title에
#   "[BangCheck/BangCheck]" 리포 prefix를 자동으로 붙인다. 이 prefix는
#   webhook 페이로드가 아니라 Discord가 붙이는 것이라 GitHub webhook
#   설정으로는 뗄 수 없다 (이슈 #254).
#
#   해법: Discord GitHub 통합 대신 discord.com/api/webhooks/... 로 직접
#   embed JSON을 만들어 보낸다. 그러면 title·author·color를 우리가 정한다.
#
# 준비물:
#   1) Discord 서버에서 새 webhook 발급 (/github suffix를 붙이지 않은 원본 URL)
#   2) 이 저장소 secrets에 DISCORD_ALERT_WEBHOOK 로 등록 (Admin)
#   3) 기존 Discord 통합 webhook은 pull_request/release 이벤트를 빼거나 제거
#      (안 그러면 이중 알림)
#
# 트리거 이벤트는 이슈 #254 1단계 조치 후 구독 중인 두 종류만 커버한다:
#   - pull_request: opened / reopened / closed / ready_for_review
#   - release: published
#   그 외(push, issues, issue_comment, pull_request_review)는 1단계에서
#   이미 소음으로 판정해 뺐다. 필요해지면 여기에 추가한다.

name: Discord Custom Notify

on:
  pull_request:
    types: [opened, reopened, closed, ready_for_review]
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord embed
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_ACTION: ${{ github.event.action }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
        run: |
          set -euo pipefail

          # secret 이 아직 등록되지 않았으면 조용히 종료한다. workflow 는
          # protected file 이라 PR 이 머지되어도 secret 이 나중에 붙을 수 있다.
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_ALERT_WEBHOOK secret 이 비어 있어 알림을 건너뜁니다."
            exit 0
          fi

          # closed + merged=true 를 "merged" 로 재라벨한다. Discord embed 에는
          # 두 상태가 다르게 보이는 편이 훨씬 유용하다.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
              LABEL="merged"
              COLOR=6120164   # #5D6BE4
            elif [ "$PR_ACTION" = "closed" ]; then
              LABEL="closed"
              COLOR=13458524  # #CD3C3C
            elif [ "$PR_DRAFT" = "true" ]; then
              LABEL="draft"
              COLOR=9807270   # #959DA5
            else
              LABEL="$PR_ACTION"
              COLOR=3066993   # #2ECC71
            fi
            TITLE="PR ${LABEL}: ${PR_TITLE}"
            URL="$PR_URL"
            AUTHOR="$PR_AUTHOR"
          else
            TITLE="Release published: ${RELEASE_NAME:-$RELEASE_TAG}"
            URL="$RELEASE_URL"
            AUTHOR="$RELEASE_AUTHOR"
            COLOR=15844367   # #F1C40F
          fi

          # jq 로 안전하게 JSON 을 조립한다. shell 문자열 escaping 을 하다
          # 따옴표가 섞이면 payload 가 깨진다.
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg url "$URL" \
            --arg author "$AUTHOR" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                color: $color,
                author: { name: $author }
              }]
            }')

          curl -sS -H "Content-Type: application/json" \
               -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
