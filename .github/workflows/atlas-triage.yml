# ============================================================
# Atlas Issue Triage
# ------------------------------------------------------------
# 이슈가 열리면 그것이 Atlas registry의 무엇에 해당하는지 코멘트로 알린다.
#
# 왜 Claude Code 훅이 아니라 Actions 인가
#   훅은 Claude Code 세션에서 이슈를 만들 때만 발동한다. 팀원이 웹 UI나 gh 로
#   만들면 돌지 않는다. 잡으려는 것이 바로 그 경우라 훅으로는 구조적으로 안 된다.
#   2026-08-05 실측이 그것을 보여줬다 — 팀원이 만든 이슈 15건이 전부 registry와
#   끊긴 채 쌓여 있었고, 아무도 그 사실을 몰랐다.
#
# 이 워크플로가 하지 않는 것
#   registry 를 고치지 않는다. defects.yaml 항목은 evidence 경로·심볼·severity·
#   disposition 을 요구하는데 자유 서술 이슈에서 그것을 기계가 만들 수 없다.
#   봇은 제안하고 사람이 확정한다.
#
# 실패해도 job 을 죽이지 않는다
#   분류가 안 된다고 이슈 등록을 막을 이유가 없다. triage_issue.py 가 gh 실패나
#   판정 불가를 exit 0 으로 흘리고, 그 사실을 코멘트나 로그로 말한다.
#
# Companion workflows:
#   atlas-resolve.yml    (registry ↔ 코드 · registry ↔ Issue 정합)
#   compliance-guard.yml (PR 컨벤션)
# ============================================================

name: Atlas Issue Triage

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: '소급 적용할 이슈 번호 (비우면 열린 이슈 전체)'
        required: false

permissions:
  contents: read
  issues: write

# 같은 이슈에서 opened/edited 가 겹치면 두 실행이 서로의 코멘트를 덮어
# 정정 이력이 오염된다. 이슈 번호 단위로 직렬화한다.
concurrency:
  group: atlas-triage-${{ github.event.issue.number || inputs.issue || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    name: Comment Atlas attribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AD-12 에 따라 .project-atlas/ 는 별도 저장소로 나갈 예정이다.
      # 나간 뒤에는 판정할 원천이 없으므로 조용히 건너뛴다.
      - name: Check registry presence
        id: presence
        run: |
          if [ -d .project-atlas/registry ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "triage 건너뜀 — .project-atlas/registry가 없다 (AD-12 분리 후 정상)"
          fi

      - name: Setup Python
        if: steps.presence.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.presence.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check -r .project-atlas/requirements.txt

      - name: Triage
        if: steps.presence.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.issue.number || '' }}" ]; then
            python .project-atlas/tools/triage_issue.py --issue ${{ github.event.issue.number }}
          elif [ -n "${{ inputs.issue || '' }}" ]; then
            python .project-atlas/tools/triage_issue.py --issue ${{ inputs.issue }}
          else
            # 소급 적용 — 열린 이슈 전체
            for n in $(gh issue list -R "${{ github.repository }}" --state open \
                         --limit 200 --json number --jq '.[].number'); do
              echo "::group::#$n"
              python .project-atlas/tools/triage_issue.py --issue "$n" || true
              echo "::endgroup::"
            done
          fi
