# 축 1 — map 묶음의 첫 조각.
#
# points 3개(조회·생성·삭제)를 한 feature로 둔 근거는 변경 이유가 하나라는 것이다.
# 셋 다 map_points 리소스의 정의 그 자체에 매달려 있다 — 컬럼이 하나 늘면
# 응답 DTO·생성 요청·소프트삭제 판정이 함께 바뀐다. MapService의 같은 세 메서드가
# 같은 MapRepository 하나를 본다.
# 반대로 GET /api/v1/map/rooms는 map_points를 읽기만 하고 그 리소스 정의가 아니라
# "매물을 어떻게 걸러 보여줄까"라는 다른 이유로 바뀌므로 분리했다(FT-MAP-ROOM-OVERLAY).

capabilityId: CAP-MAP-DISTANCE-COMPARE
capabilityTitle: 기준점을 잡고 방까지의 거리를 비교한다

featureId: FT-MAP-POINT-MANAGE
title: 지도 기준점 등록·조회·삭제
status: PLANNED
owner: "@minwoo-l"

owns:
  - operationId: OP-MAP-POINT-LIST
    route: "GET /api/v1/map/points"
    auth: JWT              # SecurityConfig는 이 경로에 permitAll이 없고 anyRequest().authenticated()로 떨어진다
    safety:
      sideEffect: READ
      writes: []
      rerunSafe: true           # mapRepository.findByUserIdAndIsDeletedFalse 하나뿐인 readOnly 경로
      abortOnFail: NONE         # 쓰기가 없어 롤백할 대상이 없다

  - operationId: OP-MAP-POINT-CREATE
    route: "POST /api/v1/map/points"
    auth: JWT
    safety:
      sideEffect: WRITE
      writes: [map_points]
      # MapService.createMapPoint는 MapPoint.create로 매번 새 엔티티를 만들어 save 한다.
      # id는 IDENTITY 생성이고 V7__add_map_tables.sql의 map_points에는 PK·FK 외
      # 유니크 제약이 없다 — 같은 요청을 두 번 보내면 같은 이름의 기준점 두 행이 남는다.
      # 최종 논리 상태가 달라지므로 false.
      rerunSafe: false
      abortOnFail: FULL_ROLLBACK   # @Transactional 단일 insert. 실패하면 행이 남지 않는다

  - operationId: OP-MAP-POINT-DELETE
    route: "DELETE /api/v1/map/points/{pointId}"
    auth: JWT
    safety:
      sideEffect: WRITE
      writes: [map_points]        # 물리 삭제가 아니라 is_deleted/deleted_at 갱신(MapPoint.softDelete)
      # 2회차 호출은 findByIdAndUserIdAndIsDeletedFalse가 비어 MAP_POINT_NOT_FOUND를 던진다.
      # 그러나 판정 기준은 최종 논리 상태이고 그 행은 이미 is_deleted=1로 같다 — 그래서 true.
      # 응답이 갈리는 것(200 → 404)은 여기 기록만 하고 rerunSafe를 뒤집지 않는다.
      rerunSafe: true
      abortOnFail: FULL_ROLLBACK

# 2026-08-04 main 실측: 이 세 operation을 부르는 프런트 코드가 없다.
# 근거 — frontend/src 전체에서 'api/v1/map', 'map/points', 'map-service' 검색 결과 0건이고
# services/ 아래에 map-service.ts 자체가 없다.
# MapPage.tsx의 '기준점'은 LANDMARK_PRESETS 상수와 localStorage('landmark-selection')로만
# 돌아간다(MapPage.tsx:22-24, 480-501). 즉 서버 기준점과 화면 기준점이 서로 다른 저장소다.
uses: []

implementedBy:
  slice: backend/src/main/java/com/room/backend/api/map
  useCase: service/MapService.java
  legacyPath: backend/src/main/java/com/room/backend/api/map/controller/MapController.java#createMapPoint
  # frontendEntry 없음 — 위 실측대로 소비 지점이 존재하지 않는다.
  # HTTP 어댑터를 대신 적지 않는다. 적을 것이 없다는 사실이 이 feature의 관측치다.
  # frontendEntry 없음 = 이 프론트에 소비 지점이 실재하지 않는다(2026-08-04 실측).
  # 아직 안 채운 것과 구별하기 위해 이 주석을 둔다 — 빈칸 두 뜻이 섞이면 Map이 거짓말한다.
  switchedOver: false

knownDefects: []   # 2026-08-04 defects.yaml에 map 계열 결함 항목 없음

tests: []   # 2026-08-04 main 기준 이 기능을 덮는 test 없음 (backend/src/test에 MapService 참조 0건)

sliceShapeNotes:
  - 세 operation이 모두 userId 스코프다. 소유권 검사가 repository 쿼리
    (findByIdAndUserIdAndIsDeletedFalse)에 내장돼 있어 별도 인가 계층이 없다.
  - 삭제가 소프트 삭제라 실제로는 WRITE지만 행이 사라지지 않는다.
    writes를 map_points로 적은 것은 그 갱신을 가리킨다.
  - 서버 기준점 API가 있는데 화면은 localStorage 프리셋을 쓴다.
    이 불일치는 operation 하나의 결함이 아니라 feature 경계 자체의 관측치라
    defects.yaml에 넣지 않고 여기 남긴다.
