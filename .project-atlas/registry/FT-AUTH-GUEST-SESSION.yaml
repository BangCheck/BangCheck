# 축 1 — CAP-AUTH-SESSION의 둘째 조각. 관측 결과이지 이관 산물이 아니다.
#
# FT-AUTH-OAUTH-LOGIN(oauth2 authorize/callback 2개)과 경계가 겹치지 않는다.
# 그쪽은 provider를 거쳐 users·refresh_tokens에 사람을 남기는 흐름이고,
# 이쪽은 사람도 행도 남기지 않는 익명 토큰 발급 하나다.
#
# 왜 refresh/logout과 같은 feature로 묶지 않았는가 (변경 이유가 다르다):
#   - 이 operation은 refresh_tokens를 쓰지 않고 쿠키를 세우지도 않는다.
#     CookieProvider를 아예 주입받지 않는 유일한 auth 엔드포인트다.
#   - AuthService를 거치지 않는다. 컨트롤러가 JwtProvider를 직접 부른다.
#   - 바뀌는 이유가 "게스트에게 무엇을 허용할 것인가"라는 제품 정책이고,
#     refresh/logout이 바뀌는 이유인 "세션 회전·쿠키 계약"과 무관하다.
#   - 결함이 몰릴 자리도 다르다. 여기는 토큰 의미(게스트가 뭘 통과하는가)이고
#     저쪽은 회전 순서와 쿠키 수명이다.

capabilityId: CAP-AUTH-SESSION
capabilityTitle: 나를 식별하고 로그인 상태를 유지한다

featureId: FT-AUTH-GUEST-SESSION
title: 계정 없이 게스트로 둘러보기
status: PLANNED
# AuthController·JwtProvider의 git author 'jiye' → team-roles.yaml의 dlwldP(Lee Ji-Ye, Backend).
# 커밋 이메일이 로컬 호스트명(jiye@jiyeui-MacBookPro.local)이라 확증이 아니라 추정이다.
owner: "@dlwldP"

owns:
  - operationId: OP-AUTH-GUEST-TOKEN
    route: "POST /api/v1/auth/guest"
    auth: PUBLIC          # SecurityConfig: requestMatchers(POST, authBasePath + "/guest").permitAll()
    safety:
      # AuthController.guest()는 jwtProvider.generateGuestToken() 하나만 부른다.
      # @Transactional도 없고 repository도 주입되지 않는다 — 어떤 테이블도 건드리지 않는다.
      # guestId는 UUID.randomUUID()로 즉석 생성되어 서명된 JWT 안에만 산다.
      sideEffect: READ
      writes: []
      rerunSafe: true
      # rerunSafe 근거: 두 번 부르면 서로 다른 guestId가 나온다. 값은 다르지만
      # 서버에 남는 것이 없으므로 최종 논리 상태는 호출 전과 같다.
      # 판정 기준이 "응답이 같은가"가 아니라 "최종 논리 상태가 같은가"이므로 true다.
      abortOnFail: NONE   # 되돌릴 상태가 없다

# 실측: frontend/src 전체에서 '/api/v1/auth/guest'를 부르는 코드가 없다.
# services/auth-service.ts에도 없다(그 파일은 oauth2 authorize·callback·users/me 셋뿐).
# 이 operation이 남의 operation을 부르지도 않는다 — 컨트롤러에서 끝난다.
uses: []

implementedBy:
  # 아직 vertical slice로 이관하지 않았다. 지금 이 기능의 코드가 사는 곳을 가리킨다.
  slice: backend/src/main/java/com/room/backend/api/auth
  # useCase를 적지 않은 이유: 이 operation에는 service 계층이 없다.
  # AuthService는 이 경로에 관여하지 않고, 실제 로직은
  # global/auth/jwt/JwtProvider.java#generateGuestToken 한 메서드다.
  # slice 밖이라 useCase(relativeTo: slice)로 표현할 수 없어 legacyPath에 진입점만 남긴다.
  legacyPath: backend/src/main/java/com/room/backend/api/auth/controller/AuthController.java#guest
  # frontendEntry를 적지 않은 이유 — 소비 지점이 실재하지 않는다.
  # 프론트의 '게스트'는 전부 로컬 개념이다: store/use-guest-room-store.ts와
  # features/checklist/data/guest-items.ts, 그리고 useAuthStore.isLoggedIn 분기.
  # 서버 게스트 토큰을 받아 오는 화면·훅은 하나도 없다.
  # 없는 소비 지점을 적으면 "연결돼 있다"는 거짓이 남으므로 비워 둔다.
  # frontendEntry 없음 = 이 프론트에 소비 지점이 실재하지 않는다(2026-08-04 실측).
  # 아직 안 채운 것과 구별하기 위해 이 주석을 둔다 — 빈칸 두 뜻이 섞이면 Map이 거짓말한다.
  switchedOver: false

knownDefects: []
# 후보 관측은 있으나 defects.yaml에 등록된 ID가 없어 참조하지 않는다.
# (이 배치에서 defects.yaml은 수정 대상이 아니다.)

tests: []   # 2026-08-04 기준 backend/src/test에는 ChecklistServiceTest 하나뿐이다

sliceShapeNotes:
  - 게스트 토큰은 발급만 되고 아무도 쓰지 않는 상태다. 백엔드에는 소비 경로가 있다 —
    JwtAuthenticationFilter가 tokenType=GUEST를 보면 SecurityContext에 인증을
    세우지 않고 그대로 통과시킨다. 그래서 게스트 토큰으로는 permitAll 엔드포인트만
    지나갈 수 있고 .anyRequest().authenticated()에는 걸린다.
    결과적으로 토큰을 들고 있으나 안 들고 있으나 접근 가능한 범위가 같다.
  - 그 관측을 defect로 올리지 않은 이유는 이것이 백엔드 결함이라기보다
    프론트가 이 엔드포인트를 아직 연결하지 않아 생긴 미연동 상태이기 때문이다.
    연결 시점에 게스트 토큰의 의미를 먼저 정해야 한다.
