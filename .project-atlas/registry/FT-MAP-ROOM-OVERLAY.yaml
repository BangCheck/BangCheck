# 축 1 — map 묶음의 둘째 조각.
#
# operation 하나뿐인데 따로 뗀 근거는 변경 이유다.
# 이 경로가 바뀌는 이유는 "지도에 매물을 어떤 조건으로 걸러 어떤 순서로 보여줄까"다 —
# rentType 필터, pointId 기준 거리 계산, maxDistance 절단, MapSortType 네 가지 정렬,
# 그리고 방마다 붙는 하자 요약. 기준점 리소스의 정의(FT-MAP-POINT-MANAGE)가 바뀌어도
# 이 정책은 그대로고, 이 정책이 바뀌어도 map_points 스키마는 그대로다.
#
# FT-ROOM-LIST(GET /api/v1/rooms)와의 관계: 경로도 operationId도 다르고 소유가 겹치지 않는다.
# 둘은 같은 rooms 테이블을 읽지만 반환 형태가 다르다 — 이쪽은 좌표·거리·도보분·하자요약을
# 얹은 MapRoomResponseDTO이고, 저쪽은 RoomListItemResponse다. 중복 소유를 만들지 않기 위해
# 여기서는 OP-ROOM-LIST를 owns에도 uses에도 넣지 않는다(이 백엔드 경로는 그것을 부르지 않는다).

capabilityId: CAP-MAP-DISTANCE-COMPARE
capabilityTitle: 기준점을 잡고 방까지의 거리를 비교한다

featureId: FT-MAP-ROOM-OVERLAY
title: 지도용 매물 목록 조회 (기준점 거리 필터·정렬)
status: PLANNED
owner: "@Woo-JongHo"

owns:
  - operationId: OP-MAP-ROOM-LIST
    route: "GET /api/v1/map/rooms"
    auth: JWT              # permitAll 목록에 없어 anyRequest().authenticated()로 떨어진다
    safety:
      sideEffect: READ
      writes: []
      # 경로 전체가 읽기다. MapService.getRoomsForMap과 getMapPointById가 readOnly 트랜잭션이고
      # RoomCheckResultService.getRoomIssuesSummary도 @Transactional(readOnly = true)다.
      # 거리·도보분은 DistanceUtil로 매 호출 계산할 뿐 room_point_distances에 쓰지 않는다.
      rerunSafe: true
      abortOnFail: NONE         # 쓰기가 없어 롤백할 대상이 없다

# 2026-08-04 main 실측: 이 operation을 부르는 프런트 코드가 없다.
# 근거 — frontend/src 전체 'api/v1/map' 검색 0건. MapPage.tsx는 지도용 목록 대신
# useRoomsList()(GET /api/v1/rooms)를 쓰고 거리·정렬을 브라우저에서 다시 계산한다
# (MapPage.tsx:465, 703-724의 distanceKm 정렬).
uses: []

implementedBy:
  slice: backend/src/main/java/com/room/backend/api/map
  useCase: service/MapService.java
  legacyPath: backend/src/main/java/com/room/backend/api/map/controller/MapController.java#getMapRooms
  # frontendEntry 없음 — 소비 지점이 존재하지 않는다.
  switchedOver: false

knownDefects: []   # 2026-08-04 defects.yaml에 map 계열 결함 항목 없음

tests: []   # 2026-08-04 main 기준 이 기능을 덮는 test 없음

sliceShapeNotes:
  - 정책이 controller에 있다. 필터·거리계산·maxDistance 절단·정렬이 전부
    MapController.getMapRooms 본문이고 MapService는 조회 두 개만 한다.
    FT-ROOM-LIST가 정렬을 도메인(RoomOrdering)으로 올린 것과 반대 방향이다.
  - 방 하나마다 getRoomIssuesSummary를 부르고 그 안에서 또 항목·옵션을 건건이 findById 한다.
    읽기지만 호출량이 방 수에 비례해 늘어난다 — 재사용 판단의 입력으로 남긴다.
  - pointId를 주면 map_points를 읽는다(mapService.getMapPointById).
    소유는 FT-MAP-POINT-MANAGE에 있고 이쪽은 같은 프로세스 안의 읽기라
    uses(operation 호출)로 적지 않았다. uses는 HTTP operation 참조만 담는다.
  - 서버가 이미 거리·도보분·정렬을 다 계산해 주는데 화면은 그것을 쓰지 않는다.
    같은 계산이 두 곳에 있다는 사실이 이 조각의 가장 큰 관측치다.
