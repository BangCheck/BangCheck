# 축 1 — map 묶음의 셋째 조각. map에 합치지 않고 따로 뺐다.
#
# 근거는 변경 이유다. 이 경로가 바뀌는 이유는 외부 제공자(SK Tmap 보행자 경로 API)의
# 계약이다 — 요청 파라미터명(startX/startY), 응답 GeoJSON 형태, appKey, 좌표계.
# map/points·map/rooms가 바뀌는 이유(우리 DB 스키마와 매물 표시 정책)와 겹치지 않는다.
# 저장소도 다르다. map 두 조각은 우리 DB를 보고 이 조각은 DB를 전혀 만지지 않는다.
# 인증 경계도 갈린다 — map은 JWT, 이 경로만 SecurityConfig에서 permitAll이다.
# 셋 다 어긋나므로 한 feature로 묶을 근거가 없다.

capabilityId: CAP-MAP-DISTANCE-COMPARE
capabilityTitle: 기준점을 잡고 방까지의 거리를 비교한다

featureId: FT-DIRECTIONS-WALKING
title: 기준점-방 도보 경로 조회
status: PLANNED
owner: "@Woo-JongHo"

owns:
  - operationId: OP-DIRECTIONS-WALKING
    route: "GET /api/v1/directions/walking"
    # SecurityConfig.java:62 — requestMatchers(HttpMethod.GET, "/api/v1/directions/walking").permitAll()
    # 컨트롤러도 SecurityUtil.getCurrentUserId()를 부르지 않는다. 토큰 없이 열린다.
    auth: PUBLIC
    safety:
      # DirectionsService는 RestClient로 https://apis.openapi.sk.com/tmap/routes/pedestrian 에
      # POST 한다. 우리 repository·엔티티를 하나도 건드리지 않고 @Transactional도 없다.
      # 그래서 READ가 아니라 EXTERNAL이다 — 실패 원인과 지연이 우리 밖에 있다.
      sideEffect: EXTERNAL
      writes: []                # 우리 DB에 쓰는 것이 없다. 결과를 캐시하지도 않는다
      # Tmap 보행자 경로는 질의다. 같은 네 좌표로 다시 불러도 원격 상태가 바뀌지 않고
      # 우리 쪽 최종 논리 상태도 그대로다(저장이 없다). 다만 호출마다 appKey 쿼터를 쓴다 —
      # 상태가 아니라 비용이라 rerunSafe를 뒤집지 않고 여기 적는다.
      rerunSafe: true
      abortOnFail: NONE         # 우리 쪽 쓰기가 없어 롤백할 대상이 없다.
                                # 응답이 비면 서비스가 null을 돌려주고 그대로 200으로 나간다

# MapPage 한 화면이 이 operation과 함께 부르는 남의 operation. 소유는 주장하지 않는다.
# 근거: frontend/src/features/map/MapPage.tsx:465 `const { data: apiRoomsData } = useRoomsList();`
#       (frontend/src/features/rooms/hooks/use-rooms-query.ts → GET /api/v1/rooms)
# 순서는 방 목록 조회 → 주소 지오코딩으로 좌표 확보 → 기준점+선택 방이 모두 있을 때만
# 도보 경로 질의가 켜진다(MapPage.tsx:456-463, enabled: params !== null).
# 즉 이 operation은 OP-ROOM-LIST의 결과 없이는 절대 호출되지 않는다.
uses: []   # 화면이 함께 부르는 것은 페이지 축이 답한다 (schema.yaml operationRef 참고).
           # 이 기능이 성립하려면 반드시 선행되어야 하는 operation만 여기 적는다.
           # MapPage가 방 목록을 함께 부르는 것은 그 화면의 사실이다

implementedBy:
  slice: backend/src/main/java/com/room/backend/api/directions
  useCase: service/DirectionsService.java
  legacyPath: backend/src/main/java/com/room/backend/api/directions/controller/DirectionsController.java#getWalkingDirections
  # 소비 지점은 훅이다. services/directions-service.ts는 HTTP 어댑터라 적지 않는다.
  frontendEntry: frontend/src/features/map/hooks/use-directions-query.ts#useWalkingDirections
  switchedOver: false

knownDefects: []   # 2026-08-04 defects.yaml에 directions 계열 결함 항목 없음

tests: []   # 2026-08-04 main 기준 이 기능을 덮는 test 없음 (backend/src/test에 DirectionsService 참조 0건)

sliceShapeNotes:
  - map 세 조각 중 유일하게 프런트 소비 지점이 실재한다. 나머지 둘은 백엔드만 있다.
  - 라우트는 GET인데 외부 호출은 POST(form-urlencoded)다. 우리 쪽 멱등성과
    외부 쪽 HTTP 메서드가 어긋나 있어 캐시·재시도 정책을 얹을 때 걸릴 자리다.
    지금은 프런트가 staleTime 5분·retry:false로 막고 있다(use-directions-query.ts:13-14).
  - 외부 응답이 비면 서비스가 null을 반환하고 컨트롤러가 그대로 ApiResponse.success(null)로
    감싼다. 실패가 200으로 나가는 형태라 EXTERNAL의 실패 신호가 소실된다.
  - 기준점 좌표의 출처가 서버 map_points가 아니라 브라우저 localStorage다
    (MapPage.tsx:456-461의 landmark). 그래서 이 operation은 우리 DB의 어떤 행과도 이어지지 않는다.
