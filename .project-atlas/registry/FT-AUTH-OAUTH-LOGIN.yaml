# 축 1 — 사용자 가치 계층 (CAPABILITY → FEATURE → OPERATION)
#
# 이 파일은 이관(refactor) 산물이 아니라 현행 코드의 관측 결과다.
# status/switchedOver가 그 사실을 말한다 — 아직 feature slice로 옮기지 않았고,
# 코드는 여전히 api/auth 패키지에 있다.
# 관측만 하고 동작은 고치지 않는다. 발견한 결함은 defects.yaml로 간다.

capabilityId: CAP-AUTH-SESSION
capabilityTitle: 나를 식별하고 로그인 상태를 유지한다

featureId: FT-AUTH-OAUTH-LOGIN
title: 소셜 계정으로 로그인
status: PLANNED
# git author 'jiye' → team-roles.yaml의 dlwldP(Lee Ji-Ye, Backend).
# 커밋 이메일이 로컬 호스트명이라 확증이 아니라 추정이다.
owner: "@dlwldP"

owns:
  - operationId: OP-AUTH-OAUTH-AUTHORIZE
    route: "GET /api/v1/auth/oauth2/{provider}"
    auth: PUBLIC          # SecurityConfig: authBasePath + authOauthBasePath + "/**" permitAll
    safety:
      sideEffect: READ
      # state는 서명된 JWT로 즉석 생성되며 서버에 저장되지 않는다 (OAuthStateService.generateState).
      # 그래서 이 operation은 아무 테이블도 건드리지 않는다.
      writes: []
      rerunSafe: true       # 호출할 때마다 새 state가 나올 뿐 남는 것이 없다
      abortOnFail: NONE

  - operationId: OP-AUTH-OAUTH-CALLBACK
    route: "GET /api/v1/auth/oauth2/{provider}/callback"
    auth: PUBLIC
    safety:
      # schema의 sideEffect는 단일 enum이라 "외부 호출 + 쓰기"를 함께 말할 수 없다.
      # 재시도 판단을 지배하는 쪽이 외부 호출(코드 1회용)이므로 EXTERNAL로 적고
      # 실제 쓰기 대상은 writes에 남긴다. 형식 한계는 batch 1 기록으로 남긴다.
      sideEffect: EXTERNAL
      writes: [users, refresh_tokens]
      rerunSafe: false      # provider의 authorization code는 1회용. 두 번째 교환은 실패한다
      abortOnFail: FULL_ROLLBACK  # AuthService.handleOAuthCallback이 @Transactional

# 이 기능이 쓰지만 소유하지 않는 외부 표면
# (provider 토큰·userinfo 엔드포인트는 제품 route가 아니라 registry에 operation으로 두지 않는다)

implementedBy:
  # 아직 vertical slice로 이관하지 않았다. 지금 이 기능의 코드가 사는 곳을 가리킨다.
  slice: backend/src/main/java/com/room/backend/api/auth
  useCase: service/AuthService.java
  legacyPath: backend/src/main/java/com/room/backend/api/auth/controller/AuthController.java#callback
  frontendEntry: frontend/src/features/auth/AuthCallbackPage.tsx#exchangeOAuthCode
  switchedOver: false

# 2026-08-10: defects.yaml 이 relatedFeature 로 이 feature 를 가리키는데
#   여기 목록에는 없던 결함을 채웠다. 두 필드는 서로의 거울이 아니다 —
#   relatedFeature 는 결함당 하나(주 귀속)이고 knownDefects 는 feature 가
#   영향받는 결함 전부라 여러 feature 가 같은 ID 를 적는다. 다만 **주 귀속으로
#   지목된 feature 가 그 결함을 모르고 있는 것**은 어느 쪽 해석으로도 맞지 않는다.
#   REF-01 은 양쪽 다 "적힌 ID 가 정의돼 있는가"만 보고, 한쪽에만 적혀 있어도
#   통과한다 — 그래서 드러나지 않았다.
knownDefects:
  - BC-AUTH-01
  - BC-AUTH-90

# 2026-08-10: 빈 배열이 낡아 있었다.
#   OAuthStateServiceTest 는 PR #267(BC-AUTH-01 수정)에서 **같은 PR 로** 들어왔는데
#   이 줄은 그대로였다. 잊은 것이 아니라 열 이유가 없었다 — 그 PR 은 결함 쪽
#   (defects.yaml 의 disposition)만 보고 feature 파일은 보지 않았다.
#
#   게이트도 안 잡았다. SRC-01 은 "적힌 테스트 경로가 실재하는가"를 보지
#   "실재하는 테스트가 적혀 있는가"를 보지 않는다 — 검사 방향이 한쪽뿐이다.
#   registry → 코드는 지키고, 코드 → registry 는 아무도 안 본다.
tests:
  - backend/src/test/java/com/room/backend/global/auth/oauth/service/OAuthStateServiceTest.java
