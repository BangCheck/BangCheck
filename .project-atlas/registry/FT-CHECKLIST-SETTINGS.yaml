# 축 1 — checklist 묶음의 셋째 조각.
#
# operation 4개로 이 묶음에서 가장 크다. 사용자 유형 선택과 항목 on/off가
# 같은 설정 화면 한 번의 저장으로 함께 나가기 때문에 한 feature로 둔다.

capabilityId: CAP-CHECKLIST-CUSTOMIZE
capabilityTitle: 내가 볼 체크리스트를 내 상황에 맞춘다

featureId: FT-CHECKLIST-SETTINGS
title: 사용자 유형 선택과 항목 표시 설정
status: PLANNED
owner: "@std-yong"

owns:
  - operationId: OP-CHECKLIST-TYPES-LIST
    route: "GET /api/checklist/types"
    auth: JWT
    safety:
      sideEffect: READ
      writes: []
      rerunSafe: true
      abortOnFail: NONE

  - operationId: OP-CHECKLIST-TYPE-SELECT
    route: "POST /api/checklist/types/{userType}"
    auth: JWT
    safety:
      sideEffect: WRITE
      writes: [user_type_selections]
      rerunSafe: true           # 이미 선택된 유형을 다시 보내도 결과 상태가 같다
      abortOnFail: FULL_ROLLBACK

  - operationId: OP-CHECKLIST-TYPE-DESELECT
    route: "DELETE /api/checklist/types/{userType}"
    auth: JWT
    safety:
      sideEffect: WRITE
      writes: [user_type_selections]
      rerunSafe: true           # 없는 것을 지워도 최종 상태가 같다
      abortOnFail: FULL_ROLLBACK

  - operationId: OP-CHECKLIST-SETTINGS-SAVE
    route: "POST /api/checklist/items/settings"
    auth: JWT
    safety:
      sideEffect: WRITE
      writes: [user_checklist_settings]
      rerunSafe: true           # 같은 disabledItemIds를 다시 보내면 상태가 같다
      abortOnFail: FULL_ROLLBACK

# 설정 저장 한 번이 남의 operation을 함께 부른다 — 소유는 주장하지 않는다.
# 근거: frontend/src/features/customization/hooks/use-customization.ts#saveCurrentSettings
# 순서는 deselect → select → custom delete → custom add → settings save 다.
uses:
  # 이 기능의 저장 작업이 직접, 순서대로 부르는 남의 operation이다.
  # 같은 화면에 놓여 있어서가 아니다 — saveCurrentSettings 본문이
  # deselect → select → custom delete → custom add → settings save 순으로 호출한다.
  # 순서와 부분 실패 관계는 페이지 축이 답하지 못한다(2026-08-04 교차 검토).
  - operationId: OP-CHECKLIST-CUSTOM-ITEM-DELETE
    route: "DELETE /api/checklist/items/custom/{customItemId}"
  - operationId: OP-CHECKLIST-CUSTOM-ITEM-ADD
    route: "POST /api/checklist/items/custom"

implementedBy:
  slice: backend/src/main/java/com/room/backend/domain/checklist
  useCase: service/ChecklistService.java
  legacyPath: backend/src/main/java/com/room/backend/domain/checklist/controller/ChecklistController.java#saveSettings
  frontendEntry: frontend/src/features/customization/hooks/use-customization.ts#saveCurrentSettings
  switchedOver: false

# 2026-08-10: defects.yaml 이 relatedFeature 로 이 feature 를 가리키는데
#   여기 목록에는 없던 결함을 채웠다. 두 필드는 서로의 거울이 아니다 —
#   relatedFeature 는 결함당 하나(주 귀속)이고 knownDefects 는 feature 가
#   영향받는 결함 전부라 여러 feature 가 같은 ID 를 적는다. 다만 **주 귀속으로
#   지목된 feature 가 그 결함을 모르고 있는 것**은 어느 쪽 해석으로도 맞지 않는다.
#   REF-01 은 양쪽 다 "적힌 ID 가 정의돼 있는가"만 보고, 한쪽에만 적혀 있어도
#   통과한다 — 그래서 드러나지 않았다.
knownDefects:
  - BC-CHK-02
  - BC-CHK-08

tests:
  # BC-CHK-02 방어: 컨트롤러 진입 전에 @NotNull이 걸려 400으로 나가는지 검증한다.
  - backend/src/test/java/com/room/backend/domain/checklist/dto/request/ChecklistSettingsRequestTest.java

sliceShapeNotes:
  - 유형 선택(types)과 항목 on/off(settings)를 한 feature로 묶은 근거는
    설정 화면 한 번의 저장이 네 operation을 순차로 호출한다는 것이다.
    프론트의 use-customization.ts가 deselect→select→delete→add→settings 순으로 부른다.
  - 그래서 이 feature의 실제 결함은 operation 하나가 아니라 그 순서에 있다.
    중간 실패 시 서버는 일부만 바뀌고 클라이언트 pending은 그대로다.
    다만 그것은 프론트 쪽 관측(FE-5)이라 여기 defect로 적지 않았다.
  - rerunSafe가 넷 다 true인 것은 각 operation 단위 판정이다.
    묶음 전체의 재실행 안전성은 위 순서 문제 때문에 별개다.
