# 축 1 — checklist 묶음의 셋째 조각.
#
# operation 4개로 이 묶음에서 가장 크다. 사용자 유형 선택과 항목 on/off가
# 같은 설정 화면 한 번의 저장으로 함께 나가기 때문에 한 feature로 둔다.

capabilityId: CAP-CHECKLIST-CUSTOMIZE
capabilityTitle: 내가 볼 체크리스트를 내 상황에 맞춘다

featureId: FT-CHECKLIST-SETTINGS
title: 사용자 유형 선택과 항목 표시 설정
status: PLANNED
owner: "@Woo-JongHo"

owns:
  - operationId: OP-CHECKLIST-TYPES-LIST
    route: "GET /api/checklist/types"
    auth: JWT
    safety:
      sideEffect: READ
      writes: []
      rerunSafe: true
      abortOnFail: NONE

  - operationId: OP-CHECKLIST-TYPE-SELECT
    route: "POST /api/checklist/types/{userType}"
    auth: JWT
    safety:
      sideEffect: WRITE
      writes: [checklist_user_type]
      rerunSafe: true           # 이미 선택된 유형을 다시 보내도 결과 상태가 같다
      abortOnFail: FULL_ROLLBACK

  - operationId: OP-CHECKLIST-TYPE-DESELECT
    route: "DELETE /api/checklist/types/{userType}"
    auth: JWT
    safety:
      sideEffect: WRITE
      writes: [checklist_user_type]
      rerunSafe: true           # 없는 것을 지워도 최종 상태가 같다
      abortOnFail: FULL_ROLLBACK

  - operationId: OP-CHECKLIST-SETTINGS-SAVE
    route: "POST /api/checklist/items/settings"
    auth: JWT
    safety:
      sideEffect: WRITE
      writes: [checklist_item_setting]
      rerunSafe: true           # 같은 disabledItemIds를 다시 보내면 상태가 같다
      abortOnFail: FULL_ROLLBACK

uses: []

implementedBy:
  slice: backend/src/main/java/com/room/backend/domain/checklist
  useCase: service/ChecklistService.java
  legacyPath: backend/src/main/java/com/room/backend/domain/checklist/controller/ChecklistController.java#saveSettings
  frontendEntry: frontend/src/services/custom-checklist-service.ts#saveSettings
  switchedOver: false

knownDefects:
  - BC-CHK-02

tests: []   # 2026-08-04 main 기준 이 기능을 덮는 test 없음

sliceShapeNotes:
  - 유형 선택(types)과 항목 on/off(settings)를 한 feature로 묶은 근거는
    설정 화면 한 번의 저장이 네 operation을 순차로 호출한다는 것이다.
    프론트의 use-customization.ts가 deselect→select→delete→add→settings 순으로 부른다.
  - 그래서 이 feature의 실제 결함은 operation 하나가 아니라 그 순서에 있다.
    중간 실패 시 서버는 일부만 바뀌고 클라이언트 pending은 그대로다.
    다만 그것은 프론트 쪽 관측(FE-5)이라 여기 defect로 적지 않았다.
  - rerunSafe가 넷 다 true인 것은 각 operation 단위 판정이다.
    묶음 전체의 재실행 안전성은 위 순서 문제 때문에 별개다.
