# 축 1 — 사용자 가치 계층 (CAPABILITY → FEATURE → OPERATION)
#
# 관계 규칙:
#   owns : 반드시 1개. "이 operation의 주인은 누구인가"에 답이 하나로 나온다 → 나무 유지
#   uses : 몇 개든. 여러 기능이 같은 operation을 쓰는 현실을 표현한다 → 그물 허용
#
# 화면(PAGE)은 최상위가 아니라 옆 축이다. 화면을 개편해도 이 뼈대는 흔들리지 않는다.

capabilityId: CAP-ROOM-COMPARE
capabilityTitle: 방을 비교해서 고른다

featureId: FT-ROOM-CREATE-WITH-CHECKLIST
title: 방 + 체크리스트 등록
status: PLANNED
owner: "@minwoo-l"

# 이 기능이 주인인 operation
owns:
  - operationId: OP-ROOM-CREATE-WITH-CHECKLIST
    route: "POST /api/v1/rooms/check-results"
    auth: JWT
    # RPA의 Unit 안전 스키마에 대응한다. 값은 현행 코드를 관찰한 결과다.
    safety:
      sideEffect: WRITE
      writes: [rooms, room_check_results, room_check_selected_options]
      rerunSafe: false          # 두 번 호출하면 방이 2개 생긴다
      abortOnFail: FULL_ROLLBACK # 단일 트랜잭션 경계

# 이 기능이 쓰지만 소유하지는 않는 operation
uses: []   # 화면이 함께 부르는 것은 페이지 축이 답한다 (schema.yaml operationRef 참고).
           # 이 기능이 성립하려면 반드시 선행되어야 하는 operation만 여기 적는다.
           # 등록 화면이 주소 검색을 함께 부르는 것은 그 화면의 사실이다

# 축 2와 만나는 유일한 지점
implementedBy:
  slice: backend/src/main/java/com/room/backend/api/room
  useCase: service/RoomService.java
  # 컨트롤러가 신규 use case로 전환됐고 legacy RoomService.createRoomWithCheckAnswers는 제거됐다
  legacyPath: backend/src/main/java/com/room/backend/api/room/controller/RoomController.java#createRoom
  frontendEntry: frontend/src/features/rooms/hooks/use-rooms-query.ts#useCreateRoom
  switchedOver: false
# 이 기능에서 관찰된 현행 결함. 고치지 않고 이슈로 넘긴다.
# 2026-08-10: defects.yaml 이 relatedFeature 로 이 feature 를 가리키는데
#   여기 목록에는 없던 결함을 채웠다. 두 필드는 서로의 거울이 아니다 —
#   relatedFeature 는 결함당 하나(주 귀속)이고 knownDefects 는 feature 가
#   영향받는 결함 전부라 여러 feature 가 같은 ID 를 적는다. 다만 **주 귀속으로
#   지목된 feature 가 그 결함을 모르고 있는 것**은 어느 쪽 해석으로도 맞지 않는다.
#   REF-01 은 양쪽 다 "적힌 ID 가 정의돼 있는가"만 보고, 한쪽에만 적혀 있어도
#   통과한다 — 그래서 드러나지 않았다.
knownDefects:
  - BC-REG-01
  - BC-REG-02
  - BC-REG-03
  - BC-REG-04
  - BC-REG-05
  - BC-ROOM-06
  - BC-SEC-01

tests:
  # BC-REG-04 방어: geocoding 업스트림 4xx/5xx/timeout이 500으로 새지 않고
  # 502·503으로 재매핑되는지 검증한다.
  - backend/src/test/java/com/room/backend/global/geocoding/service/GeocodingServiceTest.java

# 전환 준비 상태 — 컨트롤러를 붙이기 전에 갖춰야 할 것
switchoverReadiness:
  requestMapper: READY      # adapter/web/RoomRegistrationRequestMapper
  responseMapper: READY     # adapter/web/RoomRegistrationResponse (JSON 동등성 test 통과)
  errorMapper: READY        # adapter/web/RoomRegistrationErrorMapper (전수 매핑 test 통과)
  contractTest: PARTIAL     # RCWC 20건 중 17건. 미커버 3건은 아래 참조
  controllerSwitched: false
  legacyMethodRemoved: false  # main 기준 legacy가 유일 구현이다

# 계약 test 커버리지 — Story 1.1의 RCWC-01~20 기준
contractCoverage:
  covered: [RCWC-01, RCWC-02, RCWC-03, RCWC-04, RCWC-05, RCWC-06, RCWC-07, RCWC-08,
            RCWC-09, RCWC-10, RCWC-11, RCWC-12, RCWC-13, RCWC-14, RCWC-15, RCWC-16, RCWC-18]
  uncovered:
    - id: RCWC-17
      reason: Front consumer 0건 확인은 test가 아니라 source scan이다
    - id: RCWC-19
      reason: soft-deleted 방에 대한 고아 operation 동작. BC-SEC-01 처분 Story가 소유한다
    - id: RCWC-20
      reason: 미존재 방에 대한 고아 operation 동작. BC-SEC-01 처분 Story가 소유한다
