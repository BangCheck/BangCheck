# 관찰된 현행 결함 — 이슈 등록 대기
#
# 전부 리팩토링 중 발견했고 고치지 않았다. 리팩토링과 결함 수정을 섞으면
# 회귀 원인이 "구조 때문인지 수정 때문인지" 구분되지 않는다.
#
# 상태: Atlas 구축 후 GitHub Issue로 투영한다. 지금은 파일이 정본이다.
# 각 항목의 evidence는 실제 소스 위치이며 resolver가 존재성을 검증할 대상이다.

defects:
  - id: BC-SEC-01
    severity: P1
    title: 고아 엔드포인트가 방 소유권을 검증하지 않는다
    detail: >
      POST /api/v1/rooms/{roomId}/check-results 는 인증만 확인하고 room의 소유자·soft-delete를
      확인하지 않는다. 타인 방과 삭제된 방에도 답변 row가 생성된다. Front consumer는 0건이다.
    evidence:
      path: backend/src/main/java/com/room/backend/api/room/controller/RoomController.java
      symbol: saveCheckResults
      line: 92
    relatedFeature: FT-ROOM-CREATE-WITH-CHECKLIST
    relatedStory: s01-4-orphan-answer-operation-security
    disposition: UNDECIDED   # 제거 또는 소유권 보호. 403/404 정책 결정 필요

