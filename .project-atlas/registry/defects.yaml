  - id: BC-AUTH-01
    severity: P2
    title: OAuth state가 이름과 달리 소비되지 않아 재사용될 수 있다
    detail: >
      validateAndDeleteState는 이름이 삭제를 주장하지만 실제로는 서명과 만료만 검증하고
      아무것도 지우지 않는다. state는 서버에 저장되지 않는 서명 JWT(TTL 10분)라
      같은 state를 TTL 안에서 반복 제출해도 매번 통과한다. CSRF 방어가 1회성이 아니다.
      메서드 이름이 실제 동작보다 강한 보장을 주장하는 것도 함께 기록한다.
    evidence:
      path: backend/src/main/java/com/room/backend/global/auth/oauth/service/OAuthStateService.java
      symbol: validateAndDeleteState
    relatedFeature: FT-AUTH-OAUTH-LOGIN
    disposition: FIX_PLANNED   # 인메모리 1회성 nonce 저장소(+ 스케줄 청소)로 소비 처리. EC2 단일 인스턴스 전제
    issue: 255

  - id: BC-AUTH-02
    severity: P2
    title: 로그아웃이 서버 세션을 종료하지 않아 세션이 생존한다
    detail: >
