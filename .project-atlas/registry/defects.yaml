  - id: BC-ROOM-06
    issue: 241
    severity: P1
    title: 비로그인 저장이 동적 체크 항목의 답변을 통째로 버린다
    detail: >
      비로그인으로 체크리스트를 채우고 저장한 뒤 카드를 열면 선택한 항목 상당수가
      빈 상태로 보인다. 저장 호출이 answers를 넘기지 않기 때문이다.
      ChecklistNewPage의 handleSubmit은 basic·building·interior·safety·custom
      다섯 덩이만 addGuestRoom에 넘긴다. 화면이 실제로 수집하는 동적 항목의 답변은
      answers에 모이는데 그 값이 인자에 없다.
      저장 타입에도 자리가 없다. GuestRoomRaw는 다섯 섹션만 선언하며 answers를
      담을 필드가 아예 없어서, 넘겼더라도 보관되지 않았을 구조다.
      읽는 쪽도 같다. 상세 화면은 room.raw에서 다섯 섹션만 복원하고 answers는
      세팅하지 않는데, 항목 렌더는 answers를 읽는다. 그래서 동적 항목은 전부
      미선택으로 그려진다.
      보조 경로로도 남지 않는다. deriveSafetyFromAnswers는 원본 safety를 그대로
      돌려주므로 안전·생활 편의·주변 환경의 선택값이 파생 필드에도 반영되지 않는다.
      로그인 경로는 서버가 답변을 저장하므로 이 결함은 비로그인에만 나타난다.
    evidence:
      path: frontend/src/features/checklist/ChecklistNewPage.tsx
      symbol: addGuestRoom
      line: 81
    relatedFeature: FT-ROOM-CREATE-WITH-CHECKLIST
    disposition: FIX_PLANNED

