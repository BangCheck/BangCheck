    relatedFeature: FT-AUTH-SESSION-LIFECYCLE
    disposition: FIX_PLANNED   # 백엔드 POST /api/v1/auth/logout이 이미 구현돼 있어(refresh_tokens 삭제 + 쿠키 만료) 프론트 단독 연동으로 충분
    issue: 259

