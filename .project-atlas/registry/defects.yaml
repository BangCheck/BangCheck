# 관찰된 현행 결함 — 이슈 등록 대기
#
# 전부 리팩토링 중 발견했고 고치지 않았다. 리팩토링과 결함 수정을 섞으면
# 회귀 원인이 "구조 때문인지 수정 때문인지" 구분되지 않는다.
#
# 상태: Atlas 구축 후 GitHub Issue로 투영한다. 지금은 파일이 정본이다.
# 각 항목의 evidence는 실제 소스 위치이며 resolver가 존재성을 검증할 대상이다.

defects:
  - id: BC-SEC-01
