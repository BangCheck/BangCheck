      room.getHasElevator().toString(), room.getDirection().getDescription()이라
      해당 컬럼이 null이면 NullPointerException → COMMON_500이 된다.
      V18이 이 컬럼들을 nullable로 풀었고 등록 API도 null을 허용하므로 실사용 가능한 조합이다.
      계약 test RPT-07이 실제로 재현한다.
