    detail: >
      deploy-frontend.yml이 빌드 스텝에 VITE_API_URL을 env로 주입하는데, 그 secret이
      없으면 빈 문자열이 주입된다. Vite는 실제 환경변수를 .env 파일보다 우선하고
      빈 값도 "설정된 것"으로 취급하므로, 커밋된 frontend/.env.production의
      https://api.bangcheck.site 가 무시된다. 그러면 api.ts의 프로덕션 가드가 던져
      번들이 즉시 죽고 사이트 전체가 백지가 된다.
      2026-08-05 실제로 발생했다. 로컬 npm run build는 통과했는데 그것이 안전 신호가
      아니었다 — 로컬은 환경변수를 걸지 않아 .env.production이 적용됐고 CI는 빈 값을
      걸었다. 같은 명령이 두 환경에서 다른 값을 본다.
      secret을 채워 복구했으나 구조는 그대로다. secret이 지워지면 같은 일이 재현된다.
      .env.production이 이미 커밋돼 있으므로 workflow의 env 블록을 빼는 것이 옳다.
