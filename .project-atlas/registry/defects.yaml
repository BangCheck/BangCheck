  - id: BC-RPT-03
    severity: P1
    title: 선택 입력이 비어 있는 방을 비교하면 NPE로 500이 난다
    detail: >
      buildRoomFieldItem이 fieldExtractor를 null 가드 없이 호출한다. 추출식이
      room.getRentType().name(), room.getHasLoan().toString(),
      room.getCanRegisterAddress().toString(), room.getBuildingType().name(),
      room.getHasElevator().toString(), room.getDirection().getDescription()이라
      해당 컬럼이 null이면 NullPointerException → COMMON_500이 된다.
      V18이 이 컬럼들을 nullable로 풀었고 등록 API도 null을 허용하므로 실사용 가능한 조합이다.
      계약 test RPT-07이 실제로 재현한다.
    evidence:
      path: backend/src/main/java/com/room/backend/api/report/service/ReportService.java
      symbol: buildRoomFieldItem
    relatedFeature: FT-REPORT-COMPARE
    disposition: FIX_PLANNED

