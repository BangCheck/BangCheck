  - id: BC-RPT-03
    severity: P1
    title: 선택 입력이 비어 있는 방을 비교하면 NPE로 500이 난다
    detail: >
      buildRoomFieldItem이 fieldExtractor를 null 가드 없이 호출한다. 추출식이
      room.getRentType().name(), room.getHasLoan().toString(),
