# 축 1 — report 묶음의 첫 조각.
#
# 이 ID는 새로 만든 것이 아니다. defects.yaml의 BC-RPT-01이 이미
# relatedFeature로 가리키고 있었고 실체가 없었다.

capabilityId: CAP-ROOM-COMPARE
capabilityTitle: 방을 비교해서 고른다

featureId: FT-REPORT-INFO
title: 비교 페이지 진입용 방 요약과 카테고리 목록 조회
status: PLANNED
owner: "@hajimeong"

owns:
  - operationId: OP-REPORT-INFO
    route: "GET /api/v1/report/info"
    auth: JWT                     # SecurityConfig의 permitAll 목록에 없고 anyRequest().authenticated()에 걸린다
    safety:
      sideEffect: READ
      writes: []
      # ReportService#getRoomsForCompare는 roomRepository의 find 하나와
      # ChecklistCategory.values() 순회뿐이다. save·delete·flush가 없고
      # 클래스에 @Transactional(readOnly = true)가 걸려 있다.
      # 같은 요청을 두 번 보내도 최종 논리 상태가 같다.
      rerunSafe: true
      abortOnFail: NONE           # 쓰기가 없어 롤백할 대상이 없다

# 2026-08-04 main 기준 이 operation을 부르는 프런트 모듈이 없다.
# `grep -rn "api/v1/report" frontend/` 가 0건이다. 그래서 함께 불리는
# 남의 operation도 존재하지 않는다 — 추측으로 채우지 않고 비운다.
uses: []

implementedBy:
  slice: backend/src/main/java/com/room/backend/api/report
  useCase: service/ReportService.java
  legacyPath: backend/src/main/java/com/room/backend/api/report/controller/ReportController.java#getRoomsForCompare
  # frontendEntry 없음 — 소비 지점이 실재하지 않는다.
  # 화면(frontend/src/features/report/ReportPage.tsx)은 이 API를 쓰지 않고
  # OP-ROOM-LIST + OP-ROOM-DETAIL + OP-CHECKLIST-ITEMS-CUSTOMIZED로
  # 비교표를 클라이언트에서 직접 조립한다. 훅도 어댑터도 없으므로
  # 여기에 ReportPage를 적으면 없는 배선을 사실로 만드는 것이 된다.
  # frontendEntry 없음 = 이 프론트에 소비 지점이 실재하지 않는다(2026-08-04 실측).
  # 아직 안 채운 것과 구별하기 위해 이 주석을 둔다 — 빈칸 두 뜻이 섞이면 Map이 거짓말한다.
  switchedOver: false

knownDefects:
  - BC-RPT-01

tests: []   # 2026-08-04 main 기준 이 기능을 덮는 test 없음.
            # backend/src/test에는 ChecklistServiceTest 하나뿐이고
            # defects가 언급하는 계약 test RPT-06/07은 아직 없다.

sliceShapeNotes:
  - info와 compare를 한 feature로 묶지 않은 근거는 defects.yaml이 이미
    둘을 다른 relatedFeature로 갈라 두었다는 것이다(BC-RPT-01 → INFO,
    BC-RPT-02/03/04/05 → COMPARE). 그 판단을 registry가 뒤집지 않는다.
  - 형태로도 갈린다. info는 방 요약 + 카테고리 enum 나열이라 입력이 userId뿐이고,
    compare는 roomIds·categories를 받아 필드/항목 매트릭스를 만든다.
    변경 사유가 다르다 — info는 요약 카드 스펙이 바뀔 때, compare는 비교 축이 바뀔 때다.
  - BC-RPT-01의 본문은 /report/info와 /report/compare 둘 다 봉투를 안 쓴다고 적지만
    evidence.symbol이 getRoomsForCompare이고 relatedFeature가 이 feature다.
    그래서 여기에만 단다 — 결함의 소속은 defects.yaml이 정본이다.
  - 이 operation은 userId를 실제로 service까지 넘겨 소유자 방만 읽는다
    (findByUserIdAndIsDeletedFalseOrderByCreatedAtDesc). compare 쪽 BC-RPT-02와
    대비되는 지점이라 함께 적어 둔다.
