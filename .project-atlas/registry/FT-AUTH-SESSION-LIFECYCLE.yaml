# 축 1 — CAP-AUTH-SESSION의 셋째 조각. 관측 결과이지 이관 산물이 아니다.
#
# FT-AUTH-OAUTH-LOGIN과의 경계: 저쪽은 refresh_tokens 행을 "처음 만드는" 흐름이고
# (AuthService.issueJwtAndReturn → jwtService.saveRefreshToken),
# 이쪽은 이미 만들어진 그 행을 회전시키고 지우는 흐름이다.
# 소유가 겹치는 operation은 없다 — oauth2 authorize/callback 2개는 저쪽 소유다.
#
# refresh와 logout을 한 feature로 묶은 근거 (변경 이유가 같다):
#   - 둘 다 refresh_tokens 한 행의 수명을 다룬다.
#     refresh는 JwtService.saveRefreshToken(회전), logout은 deleteRefreshToken(제거).
#   - 둘 다 CookieProvider의 같은 쿠키 계약을 쓴다. 이름 refresh_token,
#     HttpOnly·Secure·SameSite=None·path=/ 가 한쪽만 바뀌면 즉시 깨진다.
#     createRefreshTokenCookie / expireRefreshTokenCookie는 그 계약의 양면이다.
#   - 결함이 여기 몰린다. 회전 정책, 쿠키 수명, "어디까지가 로그아웃인가"가
#     전부 이 두 operation의 사이에서 결정된다.
# 게스트 발급을 여기 넣지 않은 이유는 FT-AUTH-GUEST-SESSION 머리주석에 있다.

capabilityId: CAP-AUTH-SESSION
capabilityTitle: 나를 식별하고 로그인 상태를 유지한다

featureId: FT-AUTH-SESSION-LIFECYCLE
title: 로그인 세션 갱신과 종료
status: PLANNED
# AuthController·AuthService·JwtService의 git author 'jiye' → team-roles.yaml의 dlwldP.
# 커밋 이메일이 로컬 호스트명이라 확증이 아니라 추정이다.
owner: "@dlwldP"

owns:
  - operationId: OP-AUTH-TOKEN-REFRESH
    route: "POST /api/v1/auth/jwt/refresh"
    # SecurityConfig: authBasePath + authRefreshPath 를 permitAll 한다.
    # 헤더 JWT가 아니라 HttpOnly 쿠키가 권한의 근거라서 필터 인증을 요구하지 않는다.
    auth: PUBLIC
    safety:
      sideEffect: WRITE
      writes: [refresh_tokens]
      # 테이블명 근거: RefreshToken.java의 @Table(name = "refresh_tokens")와
      # V2__rename_user_id_and_add_refresh_tokens.sql의 CREATE TABLE refresh_tokens.
      rerunSafe: false
      # rerunSafe 근거 — AuthService.refresh를 따라간 결과다.
      #   1) jwtService.validateRefreshToken(userId, refreshToken)이
      #      저장된 토큰 문자열과 받은 값을 equals로 비교한다.
      #   2) 통과하면 새 refresh 토큰을 만들어 saveRefreshToken이
      #      기존 행을 existing.update(...)로 덮어쓴다 (user_id UNIQUE, 행은 1개).
      #   같은 요청을 두 번 보내면 두 번째는 저장값이 이미 새 토큰이라
      #   equals가 깨져 REFRESH_TOKEN_MISMATCH로 실패한다.
      #   최종 논리 상태도 다르다 — 매 호출이 직전 토큰을 무효화한다. 그래서 false.
      abortOnFail: FULL_ROLLBACK
      # AuthService.refresh에 @Transactional이 걸려 있고 JwtService.saveRefreshToken이
      # 그 트랜잭션에 참여한다. Set-Cookie는 성공 응답에서만 나가므로
      # 실패 시 서버 행과 클라이언트 쿠키가 함께 이전 상태로 남는다.

  - operationId: OP-AUTH-LOGOUT
    route: "POST /api/v1/auth/logout"
    auth: JWT             # SecurityConfig: authBasePath + authLogoutPath 를 .authenticated()
    safety:
      sideEffect: WRITE
      writes: [refresh_tokens]
      rerunSafe: true
      # rerunSafe 근거 — AuthController.logout → SecurityUtil.getCurrentUserId →
      # AuthService.logout → JwtService.deleteRefreshToken →
      # RefreshTokenRepository.deleteByUserId(Long) 까지 따라갔다.
      # 파생 삭제 쿼리라 대상 행이 없으면 0건 삭제로 조용히 끝나고 예외가 없다.
      # access 토큰은 stateless라 로그아웃 후에도 만료 전까지 유효하므로
      # 같은 요청을 두 번 보내도 두 번째가 401이 되지 않는다.
      # 두 경우 모두 최종 논리 상태는 "행 없음 + 만료 쿠키"로 같다. 그래서 true.
      abortOnFail: FULL_ROLLBACK   # AuthService.logout이 @Transactional

# 실측 결과 이 feature가 부르는 남의 operation은 없다.
#   - refresh는 서버 쪽에서 UserRepository·JwtProvider·JwtService만 쓴다. 전부 내부 빈이다.
#   - 프론트 쪽 api.ts 인터셉터는 재발급 성공 후 api(originalRequest)로 "원래 요청"을
#     재시도하는데, 그 대상이 고정된 operation이 아니라 401을 낸 아무 요청이다.
#     특정 operationRef로 못 적는다 — 적으면 없는 의존을 만드는 것이 된다.
#   - logout은 프론트에서 아직 호출되지 않는다(아래 frontendEntry 주석 참고).
uses: []

implementedBy:
  # 아직 vertical slice로 이관하지 않았다. 지금 이 기능의 코드가 사는 곳을 가리킨다.
  slice: backend/src/main/java/com/room/backend/api/auth
  useCase: service/AuthService.java        # refresh()와 logout() 둘 다 여기 있다
  legacyPath: backend/src/main/java/com/room/backend/api/auth/controller/AuthController.java#refresh
  # legacyPath는 필드가 하나뿐이라 두 진입점 중 재발급 쪽을 적었다.
  # 로그아웃 진입점은 같은 파일의 logout()이다.

  # frontendEntry 판정 — 이 feature에는 사용자 화면이 없다.
  #
  # refresh는 화면이 부르지 않는다. frontend/src/lib/api.ts의 응답 인터셉터가
  # 401을 보면 axios.post로 직접 친다. 그러나 api.ts는 HTTP 어댑터이므로
  # 소비 지점이 아니다 — 여기에 적지 않는다.
  # 재발급 결과를 실제로 "소비"하는 지점은 app/provider.tsx의 onTokenRefresh다.
  # 이것이 configureApi로 주입되어 새 accessToken을 useAuthStore에 써넣는다.
  # 훅도 페이지도 아니지만 앱이 재발급을 받아들이는 유일한 자리라 이것을 적는다.
  #
  # 이 선택이 2026-08-04 프론트 변경 이후 더 중요해졌다. use-auth-store.ts의
  # partialize가 accessToken을 localStorage에서 뺐기 때문에, 새로고침 후 토큰은
  # 오직 이 경로로만 되살아난다. 즉 provider.tsx#onTokenRefresh는 부수적 배선이
  # 아니라 세션 재수화의 단일 지점이다.
  frontendEntry: frontend/src/app/provider.tsx#onTokenRefresh
  switchedOver: false

# 2026-08-10: defects.yaml 이 relatedFeature 로 이 feature 를 가리키는데
#   여기 목록에는 없던 결함을 채웠다. 두 필드는 서로의 거울이 아니다 —
#   relatedFeature 는 결함당 하나(주 귀속)이고 knownDefects 는 feature 가
#   영향받는 결함 전부라 여러 feature 가 같은 ID 를 적는다. 다만 **주 귀속으로
#   지목된 feature 가 그 결함을 모르고 있는 것**은 어느 쪽 해석으로도 맞지 않는다.
#   REF-01 은 양쪽 다 "적힌 ID 가 정의돼 있는가"만 보고, 한쪽에만 적혀 있어도
#   통과한다 — 그래서 드러나지 않았다.
knownDefects:
  - BC-AUTH-02
# 아래 sliceShapeNotes의 관측들은 defects.yaml에 등록된 ID가 없어 참조하지 않는다.
# (이 배치에서 defects.yaml은 수정 대상이 아니다.)

tests: []   # 2026-08-04 기준 backend/src/test에는 ChecklistServiceTest 하나뿐이다

sliceShapeNotes:
  - >-
    logout operation은 프론트에서 호출되지 않는다. 확인 지점은 둘이다.
    features/mypage/MyPage.tsx#handleLogout에 "TODO(api-spec A-4) 서버 세션 종료
    POST /api/v1/auth/logout 미연동" 주석이 그대로 있고,
    app/layout/Header.tsx도 useAuthStore.logout()만 부른다.
    즉 현재 로그아웃은 클라이언트 store 정리일 뿐이고, 서버의 refresh_tokens 행과
    HttpOnly 쿠키는 남는다. 그래서 로그아웃 후에도 다음 401에서 인터셉터가
    재발급에 성공할 수 있다 — 화면은 로그아웃인데 세션은 살아 있다.
  - 그 결과 feature 단위 rerunSafe는 operation 단위 판정과 다르게 읽어야 한다.
    refresh(false)와 logout(true)이 섞여 있고, 실제 위험은 둘의 순서다 —
    logout이 서버까지 닿지 않는 한 refresh는 계속 성공한다.
  - api.ts 인터셉터의 재시도는 originalRequest._retry로 1회만 막혀 있다.
    재발급 자체(axios.post)는 인터셉터를 타지 않는 raw axios라 무한 루프는 없다.
