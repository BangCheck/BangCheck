# 축 1 — checklist 묶음의 둘째 조각.
#
# defect가 가장 많이 붙은 feature다(BC-CHK-01·04·05·06).
# 넷 다 입력 검증과 오류 코드 매핑에 몰려 있다.

capabilityId: CAP-CHECKLIST-CUSTOMIZE
capabilityTitle: 내가 볼 체크리스트를 내 상황에 맞춘다

featureId: FT-CHECKLIST-CUSTOM-ITEM
title: 나만의 체크 항목 추가·삭제
status: PLANNED
owner: "@Woo-JongHo"

owns:
  - operationId: OP-CHECKLIST-CUSTOM-ITEM-ADD
    route: "POST /api/checklist/items/custom"
    auth: JWT
    safety:
      sideEffect: WRITE
      writes: [checklist_custom_item]
      rerunSafe: false          # 같은 이름을 두 번 보내면 409로 거절된다 — 멱등이 아니다
      abortOnFail: FULL_ROLLBACK

  - operationId: OP-CHECKLIST-CUSTOM-ITEM-DELETE
    route: "DELETE /api/checklist/items/custom/{customItemId}"
    auth: JWT
    safety:
      sideEffect: WRITE
      writes: [checklist_custom_item]
      rerunSafe: false          # 두 번째 호출이 404가 아니라 500이다 (BC-CHK-01)
      abortOnFail: FULL_ROLLBACK

uses: []

implementedBy:
  slice: backend/src/main/java/com/room/backend/domain/checklist
  useCase: service/ChecklistService.java
  legacyPath: backend/src/main/java/com/room/backend/domain/checklist/controller/ChecklistController.java#addCustomItem
  frontendEntry: frontend/src/services/custom-checklist-service.ts#addCustomItem
  switchedOver: false

knownDefects:
  - BC-CHK-01
  - BC-CHK-04
  - BC-CHK-05
  - BC-CHK-06

tests: []   # 2026-08-04 main 기준 이 기능을 덮는 test 없음

sliceShapeNotes:
  - 추가와 삭제를 한 feature로 둔 근거는 같은 테이블의 수명주기를 함께
    소유하고 결함도 같은 지점(입력 검증·오류 매핑)에 몰려 있다는 것이다.
  - rerunSafe를 둘 다 false로 적었다. 재실행이 안전하다는 뜻이 아니라
    지금 안전하지 않다는 관측이며, BC-CHK-01·05가 그 실물이다.
  - 삭제가 권한 위반을 403이 아니라 400으로 내는 것(BC-CHK-06)은
    오류 코드 계약 문제라 여기 함께 둔다.
