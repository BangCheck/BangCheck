# Project Atlas — BangCheck marker
#
# 이 파일은 Atlas가 이 저장소를 읽기 위한 최소 메타데이터다.
# Atlas 코드·타입·의존성은 여기에 들어오지 않는다. 방향은 단방향이다 — Atlas가 이 저장소를 읽는다.
#
# 정본(registry, schema, resolver, UI)은 별도 project-atlas 저장소가 소유한다 (AD-12).
# 추출 시점: Story 1.3 완료 후.
#
# 추출이 끝나면 이 파일만 여기 남는다 — 아래 registryRoot도 그때 사라진다.
# registry가 나가면 resolver는 이 저장소의 작업 트리를 볼 수 없으므로,
# 검증 기준이 "현재 체크아웃"에서 "고정된 제품 commit SHA"로 바뀐다.

projectId: bangcheck
# 정본은 이 값이다. 로컬 origin URL은 SWYP-Backend/BangCheck이지만 그것은 옛 org 이름이고
# GitHub이 리다이렉트할 뿐이다 — 두 경로 모두 gh api에서 full_name: BangCheck/BangCheck를 답한다.
# (2026-08-05 확인. remote URL만 보고 이 값을 틀렸다고 판단한 적이 있어 근거를 남긴다.)
repo: BangCheck/BangCheck
defaultBranch: main
workingBranch: v0.2.0

# Atlas resolver가 참조하는 경로 규약
sources:
  backendRoot: backend/src/main/java
  frontendRoot: frontend/src
  migrationRoot: backend/src/main/resources/db/migration
  # 제품 관측치 정답지 — route 목록의 기계적 근거
  routeOracle: backend/src/test/resources/atlas-baseline/routes.txt

  # 정답지에 있으나 어떤 feature도 소유하지 않는 route.
  #
  # 왜 목록으로 두는가: RTE-02는 "정답지의 route가 전부 owns 되었는가"를 검사한다.
  # 프레임워크가 자동으로 여는 경로까지 소유를 요구하면 검사가 통과할 수 없고,
  # 반대로 "제품이 아닌 것 같으면 넘어간다"는 판정을 코드에 심으면 그 판정 기준이
  # 어디에도 안 적힌 채 굳는다. 면제는 데이터로 두고 근거를 옆에 적는다.
  #
  # 여기에 제품 route를 넣으면 커버리지 검사가 그만큼 눈을 감는다. 추가는 근거와 함께.
  # 목록이 낡는 것도 검사한다 — 정답지에 없는 항목은 RTE-03이 잡는다.
  routeOracleExempt:
    - "* /error"                        # Spring Boot 기본 에러 매핑. 컨트롤러가 아니다
    - "GET /swagger-ui.html"            # springdoc이 자동 등록
    - "GET /v3/api-docs"                # springdoc
    - "GET /v3/api-docs.yaml"           # springdoc
    - "GET /v3/api-docs/swagger-config" # springdoc

# 이동 전까지만 유효한 경로. 추출 시 이 키는 제거된다 (AD-12).
registryRoot: .project-atlas/registry
